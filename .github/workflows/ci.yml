name: ci

# Push-triggered checks (docs/build-phases.md "How we work"). Read-only: no id-token, no environment,
# so this workflow cannot assume the AWS role and never deploys. Deploys are manual dispatches only.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (exact lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  repo:
    name: repo (terraform fmt, simulator self-test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: tf
        run: echo "version=$(jq -r '.terraform_version' infrastructure/envs/common.auto.tfvars.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive infrastructure/

      - name: Setup Python (version from .python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Simulator self-test
        run: python3 -B tools/sim/selftest.py
