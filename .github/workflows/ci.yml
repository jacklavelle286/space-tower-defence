name: ci

# Push- and pull-request-triggered checks (docs/build-phases.md "How we work"; branches in ADR-0044). Read-only: no
# id-token, no environment, so this workflow cannot assume an AWS role and never deploys. Feature branches are checked
# through their pull requests into dev.

on:
  push:
    branches: [main, family, dev]
  pull_request:
    branches: [main, family, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (exact lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Gate M, LD6: the game-data-check bundle (a Lambda's code) must be byte-identical when rebuilt, and zip.
      - name: game-data-check bundle twice, same bytes; its Lambda zip
        run: |
          sha256sum game-data-check/dist/index.mjs > "$RUNNER_TEMP/gdc-1.sha256"
          npm run build --workspace @scd/game-data-check
          sha256sum game-data-check/dist/index.mjs | diff "$RUNNER_TEMP/gdc-1.sha256" -
          python3 ../scripts/build_lambdas.py --node-only --out "$RUNNER_TEMP/node-zip"

      - name: G-15 game data, into the player build as the release does
        run: |
          node game-core/scripts/build-bounds.ts --check
          node game-core/scripts/build-bounds.ts --out player/dist/game-data

      - name: G-6 built-asset scan
        working-directory: .
        run: python3 scripts/scan_dist.py web/player/dist web/admin/dist

  repo:
    name: repo (terraform fmt and tests, simulator self-test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: tf
        run: echo "version=$(jq -r '.terraform_version' infrastructure/envs/common.auto.tfvars.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive infrastructure/

      # Offline: mock providers, no credentials, no backend (Phase 42). The pictures bucket and queue policies, the
      # alerts topic policy (Budgets added, the default statement kept), the budget, and the /pictures/* behaviour.
      # Every folder has a committed lock (the modules' hold the root's hashicorp/aws entry), so the provider build
      # is pinned and hash-checked: a new provider release cannot change the result.
      - name: Terraform tests (mock providers)
        run: |
          for dir in infrastructure/main infrastructure/platform infrastructure/modules/backup infrastructure/modules/dynamodb_table infrastructure/modules/monitoring infrastructure/modules/static_site; do
            echo "::group::terraform test $dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

      - name: Setup Python (version from .python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Simulator self-test
        run: python3 -B tools/sim/selftest.py

  scripts:
    name: scripts (G-5 invariants, plan guard, route keys, asset scan, manifest, publish, smoke, CloudFront Function tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python (version from .python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==9.2.0

      - name: G-5 repository invariants
        run: python scripts/check_invariants.py

      - name: G-14 speech definitions against the listening verdicts
        run: python scripts/check_speech_defs.py

      - name: Script tests
        run: python -m pytest scripts/tests -q

  api:
    name: api (ruff, pytest + moto + DynamoDB Local, reproducible Lambda zips)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # G-13: the same pinned image as release.yml's checks job.
      dynamodb:
        image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 8000:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python (version from .python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: Install (exact pins)
        run: python -m pip install --disable-pip-version-check -r api/requirements-dev.txt

      # api/pyproject.toml holds the ruff settings; --config applies them to the build-script files and the seed script.
      # The older scripts/ files are not yet ruff-clean, so they are not listed here.
      - name: Ruff
        run: >-
          ruff check --config api/pyproject.toml api scripts/build_lambdas.py scripts/tests/test_build_lambdas.py
          scripts/lambda_artifacts.py scripts/tests/test_lambda_artifacts.py scripts/seed_content.py scripts/gen_topics.py
          scripts/tests/test_terraform_locks.py scripts/gamedata_lock_check.py scripts/tests/test_gamedata_lock_check.py

      - name: Wait for DynamoDB Local
        run: |
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000; then echo "DynamoDB Local is up"; exit 0; fi
            sleep 1
          done
          echo "::error::DynamoDB Local did not answer on localhost:8000"; exit 1

      # DDB_LOCAL_ENDPOINT makes the ddblocal tests (G-13) run and required (unreachable is an error, not a skip).
      - name: Pytest (unit with moto; integration with DynamoDB Local)
        env:
          DDB_LOCAL_ENDPOINT: http://localhost:8000
        run: python -m pytest api -rs

      # The build-script tests again, here where the runtime packages are installed, so the zip import test runs
      # (it is skipped in the `scripts` job).
      - name: Build-script tests (with runtime packages)
        run: python -m pytest scripts/tests/test_build_lambdas.py -q

      # H.9.2: two builds from the same commit must give byte-identical zips.
      - name: Build Lambda zips twice and compare hashes
        run: |
          python scripts/build_lambdas.py --out "$RUNNER_TEMP/zips-1"
          python scripts/build_lambdas.py --out "$RUNNER_TEMP/zips-2"
          (cd "$RUNNER_TEMP/zips-1" && sha256sum ./*.zip) > "$RUNNER_TEMP/zips-1.sha256"
          (cd "$RUNNER_TEMP/zips-2" && sha256sum ./*.zip) > "$RUNNER_TEMP/zips-2.sha256"
          cat "$RUNNER_TEMP/zips-1.sha256"
          diff "$RUNNER_TEMP/zips-1.sha256" "$RUNNER_TEMP/zips-2.sha256"
