name: ci

# Push-triggered checks (docs/build-phases.md "How we work"). Read-only: no id-token, no environment,
# so this workflow cannot assume the AWS role and never deploys. Deploys are manual dispatches only.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (exact lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: G-6 built-asset scan
        working-directory: .
        run: python3 scripts/scan_dist.py web/player/dist web/admin/dist

  repo:
    name: repo (terraform fmt, spike roots, simulator self-test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: tf
        run: echo "version=$(jq -r '.terraform_version' infrastructure/envs/common.auto.tfvars.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive infrastructure/

      # Spike roots (Phases 5-6, ADR-0020): fmt and validate each one without a backend, against its own lock file.
      # No AWS access; the step does nothing once spikes/ is deleted at the end of Phase 6.
      - name: Spike roots (fmt, validate)
        run: |
          shopt -s nullglob
          for dir in spikes/*/; do
            [[ -n "$(find "$dir" -maxdepth 1 -name '*.tf' -print -quit)" ]] || continue
            echo "== $dir"
            terraform fmt -check -recursive "$dir"
            terraform -chdir="$dir" init -input=false -backend=false -lockfile=readonly
            terraform -chdir="$dir" validate
          done

      - name: Setup Python (version from .python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Simulator self-test
        run: python3 -B tools/sim/selftest.py

  scripts:
    name: scripts (plan guard, asset scan, manifest, CloudFront Function tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python (version from .python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==9.2.0

      - name: Script tests
        run: python -m pytest scripts/tests -q
