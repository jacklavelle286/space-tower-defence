name: deploy

# One-shot deploy for the serverless stack:
#   frontend → build the SPA and sync it to the S3 bucket CloudFront serves
#   backend  → build & push the container image, then point the API Lambda at it
#   terraform → apply infra + Lambda configuration (env vars etc.)
# The old ECS force-new-deployment rollout is gone — the API is a Lambda now.
# Each step is toggleable so a frontend-only or backend-only deploy is possible.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        required: true
        type: choice
        options: [prod, staging]
        default: prod
      component:
        description: Which component(s) to deploy
        required: true
        type: choice
        options: [frontend, backend, both]
        default: both
      tag:
        description: Backend image tag
        required: true
        default: latest
      also_tag_sha:
        description: Also tag the backend image with the git sha (traceability)
        required: true
        type: boolean
        default: true
      run_terraform:
        description: Run terraform apply (infra + Lambda config)
        required: true
        type: boolean
        default: true
      deploy_backend:
        description: Point the API Lambda at the freshly-pushed image
        required: true
        type: boolean
        default: true
      rebuild_apk:
        description: Also rebuild the Android APK and publish it to jackgl.com/app/latest.apk (only needed when native/shell config changed)
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      region: ${{ steps.vars.outputs.region }}
      account: ${{ steps.vars.outputs.account }}
      environment: ${{ steps.vars.outputs.environment }}
      project: ${{ steps.vars.outputs.project }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read environment configuration
        id: vars
        run: |
          REGION=$(jq -r '.region' infrastructure/envs/common.auto.tfvars.json)
          ACCOUNT=$(jq -r '.aws_account_id' infrastructure/envs/${{ inputs.env }}.tfvars.json)
          ENVIRONMENT=$(jq -r '.environment' infrastructure/envs/${{ inputs.env }}.tfvars.json)
          PROJECT=$(jq -r '.project' infrastructure/envs/common.auto.tfvars.json)
          SHA=$(git rev-parse --short HEAD)

          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "account=$ACCOUNT" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "project=$PROJECT" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

  # Optional: rebuild the Android APK and publish it to jackgl.com/app/latest.apk.
  # Only needed when a NATIVE thing changed (plugin, icon, capacitor/tauri config)
  # — plain web/backend changes already reach the phone via the site. Reuses the
  # shell-release workflow's Android job (skips its Linux build + GitHub Release).
  refresh-apk:
    needs: config
    if: ${{ inputs.rebuild_apk }}
    # The called workflow is validated in full (even its skipped 'release' job,
    # which needs contents: write), so grant both here — scoped to this job only.
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/shell-release.yml
    with:
      android_only: true
      tag: apk-${{ needs.config.outputs.sha }}
    secrets: inherit

  # The test suite, before anything is built or deployed.
  #
  # It ran nowhere until now: 40 files, under a minute, and a push could ship
  # a change that broke them with nothing to say so. Several of them exist
  # precisely because a bug reached production once already — the DST
  # recurrence drift, the Skylight read that would delete the whole calendar,
  # the series edit that timed out.
  #
  # Both deploy jobs depend on this, so a red suite stops the deploy rather
  # than merely annotating it. Node and Python only — no AWS credentials,
  # because nothing here touches AWS.
  tests:
    runs-on: ubuntu-latest
    needs: config
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/jacks-productivity-tool/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Two tests compile the app's real jobs.ts and recording.ts and import
      # the result, rather than asserting against the source as text. That
      # needs the esbuild that comes in with vite, so the web dependencies
      # have to be here.
      - name: Install web dependencies
        working-directory: web/jacks-productivity-tool
        run: npm ci

      # Verified against a venv holding exactly this list and nothing else —
      # a local .venv accumulates extras and hides a missing one until the
      # first push. pglast validates SQL in the invariants test, pypdf and
      # reportlab the invoice PDF; the rest are what the API routers import.
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet \
            fastapi pydantic pglast python-dateutil pypdf requests reportlab \
            cryptography pyjwt

      - name: Run the suite
        run: ./tests/run.sh

  # Frontend deploy == build the SPA, sync to the S3 bucket CloudFront serves,
  # then invalidate the cache. There is no separate rollout — the sync IS the
  # deploy. Mirrors frontend-sync.yml.
  frontend:
    runs-on: ubuntu-latest
    needs: [config, tests]
    if: ${{ inputs.component == 'frontend' || inputs.component == 'both' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.config.outputs.account }}:role/github-federation
          aws-region: ${{ needs.config.outputs.region }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build SPA
        working-directory: web/jacks-productivity-tool
        run: |
          npm ci
          npm run build

      - name: Sync to S3
        working-directory: web/jacks-productivity-tool
        run: |
          BUCKET="${{ needs.config.outputs.account }}-${{ needs.config.outputs.region }}-${{ needs.config.outputs.environment }}-spa-bucket"
          # Hashed assets — cache hard.
          aws s3 sync dist/ "s3://$BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          # index.html — never cache, so new deploys take effect immediately.
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          COMMENT="${{ needs.config.outputs.project }}-${{ needs.config.outputs.environment }}"
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='$COMMENT'].Id | [0]" \
            --output text)
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
            echo "Invalidated $DIST_ID"
          else
            echo "No CloudFront distribution found for comment $COMMENT (skipping invalidation)"
          fi

  build-backend:
    runs-on: ubuntu-latest
    needs: [config, tests]
    if: ${{ inputs.component == 'backend' || inputs.component == 'both' }}
    outputs:
      repo: ${{ steps.vars.outputs.repo }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.config.outputs.account }}:role/github-federation
          aws-region: ${{ needs.config.outputs.region }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # public.ecr.aws is a different registry from our own ECR, and the login
      # above doesn't cover it. The Dockerfile pulls the Lambda web adapter
      # from there, and anonymous pulls share a data quota per source IP —
      # which on GitHub's runners means sharing with the whole platform. It
      # worked until that pool ran dry, then every build failed with
      # "429 toomanyrequests: Data limit exceeded". Authenticating puts the
      # pull on our own account's allowance instead.
      #
      # us-east-1 regardless of where we deploy: that's the only region that
      # issues ECR Public tokens.
      - name: Login to ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Prepare variables
        id: vars
        run: |
          REPO="${{ needs.config.outputs.account }}.dkr.ecr.${{ needs.config.outputs.region }}.amazonaws.com/${{ needs.config.outputs.project }}-${{ needs.config.outputs.environment }}-${{ needs.config.outputs.region }}-backend"
          echo "repo=$REPO" >> $GITHUB_OUTPUT

      - name: Build image
        run: |
          docker build -f docker/api/Dockerfile \
            -t ${{ steps.vars.outputs.repo }}:${{ inputs.tag }} .

      - name: Tag SHA
        if: ${{ inputs.also_tag_sha }}
        run: |
          docker tag ${{ steps.vars.outputs.repo }}:${{ inputs.tag }} \
            ${{ steps.vars.outputs.repo }}:${{ needs.config.outputs.sha }}

      - name: Push image
        run: docker push ${{ steps.vars.outputs.repo }}:${{ inputs.tag }}

      - name: Push SHA
        if: ${{ inputs.also_tag_sha }}
        run: docker push ${{ steps.vars.outputs.repo }}:${{ needs.config.outputs.sha }}

  # Terraform apply ships infra + Lambda *configuration* (env vars, memory, etc).
  # It does NOT roll new image code onto the Lambda: image_uri pins :latest (an
  # unchanged string), so the deploy-backend job below does that explicitly.
  terraform:
    runs-on: ubuntu-latest
    needs: config
    if: ${{ inputs.run_terraform }}
    environment:
      name: ${{ inputs.env }}
    defaults:
      run:
        shell: bash
    env:
      TF_VAR_db_username: ${{ secrets.POSTGRES_USER }}
      TF_VAR_db_password: ${{ secrets.POSTGRES_PASSWORD }}
      TF_VAR_db_name: ${{ secrets.POSTGRES_DB }}
      TF_VAR_ai_creds: ${{ secrets.AI_CREDS }}
      TF_VAR_weather_api_key: ${{ secrets.WEATHER_API_KEY }}
      TF_VAR_google_calendar_feeds: ${{ secrets.LAVELLEJ286_ICAL_SECRET }}
      TF_VAR_auth_secret: ${{ secrets.AUTH_SECRET }}
      # Optional: OpenAI Admin key for the dashboard spend widget (empty is fine).
      TF_VAR_openai_admin_key: ${{ secrets.OPENAI_ADMIN_KEY }}
      # Web-push signing key (empty is fine until push is used).
      TF_VAR_vapid_private_key: ${{ secrets.VAPID_PRIVATE_KEY }}
      # FCM service-account JSON for native Android push (empty is fine).
      TF_VAR_fcm_credentials: ${{ secrets.FCM_CREDENTIALS }}
      # Public iCal feed token for the shared Family calendar (empty disables the
      # feed).
      TF_VAR_family_feed_token: ${{ secrets.FAMILY_FEED_TOKEN }}
      TF_VAR_skylight_refresh_token: ${{ secrets.SKYLIGHT_REFRESH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.config.outputs.account }}:role/github-federation
          aws-region: ${{ needs.config.outputs.region }}

      - name: Verify AWS account matches env tfvars
        run: |
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          EXPECTED="${{ needs.config.outputs.account }}"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "Account mismatch ($ACTUAL != $EXPECTED)"; exit 1; }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init (remote backend)
        working-directory: infrastructure/main
        run: |
          BUCKET="${{ needs.config.outputs.account }}-${{ needs.config.outputs.region }}-${{ needs.config.outputs.project }}-${{ needs.config.outputs.environment }}"
          terraform init \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ needs.config.outputs.region }}" \
            -backend-config="dynamodb_table=$BUCKET" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: infrastructure/main
        run: terraform validate

      - name: Terraform Apply
        working-directory: infrastructure/main
        run: |
          terraform apply -auto-approve \
            -var-file=../../infrastructure/envs/common.auto.tfvars.json \
            -var-file=../../infrastructure/envs/${{ inputs.env }}.tfvars.json

  # Point the API Lambda at the freshly-pushed image and wait until it's active.
  # Runs after terraform so a same-run config change (env vars) finishes first —
  # Lambda rejects a code update while a config update is still in progress.
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [config, build-backend, terraform]
    if: >-
      ${{ always() && inputs.deploy_backend &&
          (inputs.component == 'backend' || inputs.component == 'both') &&
          needs.config.result == 'success' &&
          needs.build-backend.result == 'success' &&
          needs.terraform.result != 'failure' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.config.outputs.account }}:role/github-federation
          aws-region: ${{ needs.config.outputs.region }}

      # Terraform may have just changed the CloudFront config (e.g. the
      # x-origin-verify secret header). Wait until that change has propagated to
      # all edges BEFORE the Lambda starts enforcing it — otherwise edges still
      # sending the old (header-less) request would get 403'd by the new image.
      # No-op on steady-state deploys (distribution already "Deployed").
      - name: Wait for CloudFront to finish deploying
        run: |
          COMMENT="${{ needs.config.outputs.project }}-${{ needs.config.outputs.environment }}"
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='$COMMENT'].Id | [0]" \
            --output text)
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            echo "Waiting for CloudFront $DIST_ID to reach Deployed…"
            aws cloudfront wait distribution-deployed --id "$DIST_ID"
            echo "CloudFront $DIST_ID is deployed."
          else
            echo "No CloudFront distribution found for comment $COMMENT (skipping wait)"
          fi

      - name: Update API Lambda image
        run: |
          FUNCTION="${{ needs.config.outputs.project }}-${{ needs.config.outputs.environment }}-${{ needs.config.outputs.region }}-api"
          IMAGE="${{ needs.build-backend.outputs.repo }}:${{ inputs.tag }}"
          echo "Pointing $FUNCTION at $IMAGE…"

          # Make sure no update (e.g. terraform's config change) is still settling.
          aws lambda wait function-updated --function-name "$FUNCTION"

          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --image-uri "$IMAGE" \
            --publish \
            --query 'Version' --output text

          aws lambda wait function-updated --function-name "$FUNCTION"
          echo "✅ $FUNCTION is running the new image."
