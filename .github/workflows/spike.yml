name: spike

# Throwaway spike stacks (J M0-15, build Phase 5-6, ADR-0020): plan, apply or destroy ONE spike root, spikes/<spike>/,
# with its own state key spikes/<spike>/terraform.tfstate in the state bucket. It can never reach infrastructure/main or
# main/terraform.tfstate:
#   - the spike name is a choice list, and the working directory and the backend key are built only from it;
#   - the guard step fails the job unless the name matches ^[a-z0-9-]+$, the directory is a real (non-symlink)
#     directory whose realpath is exactly $GITHUB_WORKSPACE/spikes/<spike>, the key starts "spikes/", and neither the
#     directory nor the key has a "main" path segment or the word "infrastructure"; and the root's *.tf files have no
#     import or removed block, module or terraform_remote_state, and there are no *.tf.json files;
#   - after init, the backend Terraform actually configured (.terraform/terraform.tfstate) must be s3, in the state
#     bucket, at exactly that key, so a backend block in the spike root cannot redirect it.
# A plan is saved to tfplan and the same job applies that file (apply), or plans -destroy, saves and applies it
# (destroy). After destroy, terraform state list must be empty or the job fails.
#
# The owner dispatches it; there is no approval environment (spikes are throwaway). It uses environment prod only so
# the CI role's OIDC trust applies (W-3). It has its own concurrency group per spike, so a spike never blocks a release
# (terraform-prod) and two runs of the same spike queue behind each other.
#
# Deleted with every spikes/ root at the end of Phase 6, once each spike's state is empty (M0-15).
#
# Rules this file keeps (H.7.1): workflow_dispatch on main only; inputs reach shell only through env: (W-9); one job
# with exactly contents: read and id-token: write; account guard in configure-aws-credentials (W-8; each spike root's
# provider also sets allowed_account_ids); runner and Terraform pinned (W-7).

on:
  workflow_dispatch:
    inputs:
      spike:
        description: "Which spike root (spikes/<spike>/)"
        required: true
        type: choice
        options:
          - auth-cognito
      action:
        description: "plan: show the plan only. apply: plan and apply it. destroy: plan -destroy and apply it."
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions: {}

concurrency:
  group: spike-${{ inputs.spike }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  spike:
    name: ${{ inputs.action }} spikes/${{ inputs.spike }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse anything but main; check the action
        env:
          ACTION: ${{ inputs.action }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::spike.yml runs only from main; this run was dispatched from $GITHUB_REF."
            exit 1
          fi
          case "$ACTION" in
            plan|apply|destroy) ;;
            *) echo "::error::Unknown action '$ACTION'."; exit 1 ;;
          esac
          echo "OUT=$RUNNER_TEMP/spike" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/spike"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Guard - the working directory and state key are this spike's only
        id: guard
        env:
          SPIKE: ${{ inputs.spike }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # 1. The name: lower-case letters, digits and hyphens only (no "/", "." or "..").
          [[ "$SPIKE" =~ ^[a-z0-9-]+$ ]] || fail "Spike name '$SPIKE' must match ^[a-z0-9-]+\$."

          # 2. Both values are built from the name and nothing else.
          DIR="spikes/$SPIKE"
          KEY="spikes/$SPIKE/terraform.tfstate"

          # 3. The directory is a real directory (not a symlink), and resolves to exactly $GITHUB_WORKSPACE/spikes/<spike>.
          [[ -d "$DIR" ]] || fail "$DIR does not exist on main."
          [[ ! -L "$DIR" && ! -L spikes ]] || fail "$DIR (or spikes/) is a symlink."
          SPIKES_ROOT=$(realpath -e "$GITHUB_WORKSPACE/spikes")
          REAL_DIR=$(realpath -e "$DIR")
          [[ "$SPIKES_ROOT" == "$GITHUB_WORKSPACE/spikes" ]] || fail "spikes/ resolves to $SPIKES_ROOT."
          [[ "$REAL_DIR" == "$SPIKES_ROOT/$SPIKE" ]] || fail "$DIR resolves to $REAL_DIR, not under $SPIKES_ROOT/."
          # No symlink anywhere in the root (a linked .tf file could pull in another root's configuration).
          LINKS=$(find "$DIR" -type l)
          [[ -z "$LINKS" ]] || fail "$DIR contains symlinks: $LINKS"
          # No configuration that could reach another root's resources or state: no import/removed blocks (an import
          # of a production ID would put it in spike state, and the next destroy would delete it), no modules (a
          # module source can point at infrastructure/main), no terraform_remote_state, and no JSON-syntax .tf.json
          # files (the grep below reads HCL only).
          TF_JSON=$(find "$DIR" -name '*.tf.json')
          [[ -z "$TF_JSON" ]] || fail "$DIR contains .tf.json files (spike roots are HCL only): $TF_JSON"
          if grep -RnE '^[[:space:]]*(import|removed)[[:space:]]*\{|^[[:space:]]*module[[:space:]]+"|terraform_remote_state' \
              --include='*.tf' "$DIR"; then
            fail "$DIR uses an import or removed block, a module, or terraform_remote_state (lines above)."
          fi

          # 4. The key is under spikes/.
          [[ "$KEY" == spikes/* ]] || fail "State key '$KEY' does not start with spikes/."

          # 5. Neither has a "main" path segment or mentions "infrastructure" (checked on the repository-relative
          #    directory, its resolved form and the key, so the runner's own path cannot cause a false alarm).
          REL_DIR="${REAL_DIR#"$GITHUB_WORKSPACE"/}"
          for v in "$DIR" "$REL_DIR" "$KEY"; do
            [[ "/$v/" != */main/* ]] || fail "'$v' has a 'main' path segment."
            [[ "$v" != *infrastructure* ]] || fail "'$v' mentions infrastructure."
          done

          # 6. The spike's own committed lock file (init runs with -lockfile=readonly).
          [[ -f "$DIR/.terraform.lock.hcl" ]] || fail "$DIR/.terraform.lock.hcl is not committed."

          {
            echo "dir=$DIR"
            echo "key=$KEY"
          } >> "$GITHUB_OUTPUT"
          echo "Spike root $DIR, state key $KEY."

      - name: Read the env files
        id: vars
        run: |
          COMMON_FILE="infrastructure/envs/common.auto.tfvars.json"
          ENV_FILE="infrastructure/envs/prod.tfvars.json"
          [[ -f "$COMMON_FILE" && -f "$ENV_FILE" ]] || { echo "::error::Missing env files"; exit 1; }

          PROJECT=$(jq -r '.project' "$COMMON_FILE")
          REGION=$(jq -r '.region' "$COMMON_FILE")
          TF_VERSION=$(jq -r '.terraform_version' "$COMMON_FILE")
          ACCOUNT=$(jq -r '.aws_account_id' "$ENV_FILE")
          ENVIRONMENT=$(jq -r '.environment' "$ENV_FILE")
          for v in PROJECT REGION TF_VERSION ACCOUNT ENVIRONMENT; do
            [[ -n "${!v}" && "${!v}" != "null" ]] || { echo "::error::$v is not set in the env files"; exit 1; }
          done

          # Same names as release.yml and plan.yml (bootstrap locals.tf and outputs.tf).
          {
            echo "environment=$ENVIRONMENT"
            echo "account=$ACCOUNT"
            echo "region=$REGION"
            echo "tf_version=$TF_VERSION"
            echo "role_arn=arn:aws:iam::${ACCOUNT}:role/${PROJECT}-${ENVIRONMENT}-github-oidc"
            echo "state_bucket=${ENVIRONMENT}-state-bucket-${PROJECT}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Terraform ${{ steps.vars.outputs.tf_version }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.vars.outputs.tf_version }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.vars.outputs.role_arn }}
          aws-region: ${{ steps.vars.outputs.region }}
          allowed-account-ids: ${{ steps.vars.outputs.account }}

      - name: Verify AWS account and state bucket
        env:
          ACCOUNT: ${{ steps.vars.outputs.account }}
          STATE_BUCKET: ${{ steps.vars.outputs.state_bucket }}
        run: |
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          [[ "$ACTUAL" == "$ACCOUNT" ]] || { echo "::error::Account mismatch: $ACTUAL"; exit 1; }
          aws s3api head-bucket --bucket "$STATE_BUCKET" \
            || { echo "::error::State bucket $STATE_BUCKET not found"; exit 1; }

      - name: Terraform init (spike state key, native locking, the spike's lock file)
        working-directory: ${{ steps.guard.outputs.dir }}
        env:
          STATE_BUCKET: ${{ steps.vars.outputs.state_bucket }}
          REGION: ${{ steps.vars.outputs.region }}
          KEY: ${{ steps.guard.outputs.key }}
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=$KEY" \
            -backend-config="region=$REGION" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

          # The backend Terraform actually configured, whatever the root's backend block says: s3, this bucket, this key.
          jq -e --arg bucket "$STATE_BUCKET" --arg key "$KEY" '
              .backend.type == "s3" and .backend.config.bucket == $bucket and .backend.config.key == $key' \
              .terraform/terraform.tfstate > /dev/null \
            || { echo "::error::The configured backend is not s3://$STATE_BUCKET/$KEY: $(jq -c '.backend | {type, bucket: .config.bucket, key: .config.key}' .terraform/terraform.tfstate)"; exit 1; }
          ws=$(terraform workspace show)
          [[ "$ws" == "default" ]] || { echo "::error::Workspace is '$ws'; spikes use the default workspace."; exit 1; }
          echo "Backend: s3://$STATE_BUCKET/$KEY"

      - name: Terraform plan (saved)
        id: plan
        working-directory: ${{ steps.guard.outputs.dir }}
        env:
          ACTION: ${{ inputs.action }}
          ENVIRONMENT: ${{ steps.vars.outputs.environment }}
          DIR: ${{ steps.guard.outputs.dir }}
          KEY: ${{ steps.guard.outputs.key }}
        run: |
          VAR_FILES=(-var-file=../../infrastructure/envs/common.auto.tfvars.json
                     -var-file="../../infrastructure/envs/$ENVIRONMENT.tfvars.json")
          # Terraform auto-loads *.auto.tfvars.json from the root, but before -var-file; naming it last makes the
          # spike's own values win over the env files.
          if [[ -f spike.auto.tfvars.json ]]; then
            VAR_FILES+=(-var-file=spike.auto.tfvars.json)
          fi
          MODE=()
          if [[ "$ACTION" == destroy ]]; then
            MODE=(-destroy)
            echo "State before destroy (empty if the spike was never applied):"
            terraform state list || true
          fi

          set +e
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode "${MODE[@]}" -out=tfplan "${VAR_FILES[@]}"
          rc=$?
          set -e
          case "$rc" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT"; verdict="No changes." ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT"; verdict="Changes (applied below only when action is apply or destroy)." ;;
            *) echo "::error::terraform plan failed (exit $rc)"; exit 1 ;;
          esac

          # terraform show prints sensitive values as (sensitive value).
          terraform show -no-color tfplan > "$OUT/plan.txt"
          {
            echo "## Spike \`$DIR\`: $ACTION on \`$GITHUB_SHA\`"
            echo ""
            echo "State key: \`$KEY\`"
            echo ""
            echo "**$verdict**"
            echo ""
            echo '```'
            head -c 900000 "$OUT/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply (the saved plan)
        if: (inputs.action == 'apply' || inputs.action == 'destroy') && steps.plan.outputs.changes == 'true'
        working-directory: ${{ steps.guard.outputs.dir }}
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Outputs to the run summary (non-sensitive only)
        if: inputs.action == 'apply'
        working-directory: ${{ steps.guard.outputs.dir }}
        run: |
          terraform output -json > "$OUT/outputs.json"
          {
            echo "### Outputs"
            echo ""
            echo "Sensitive outputs are not shown: $(jq -r '[to_entries[] | select(.value.sensitive == true) | .key] | if length == 0 then "none" else join(", ") end' "$OUT/outputs.json")"
            echo ""
            echo '```json'
            jq 'with_entries(select(.value.sensitive != true) | .value = .value.value)' "$OUT/outputs.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$OUT/outputs.json"

      - name: Destroy left nothing in state
        if: inputs.action == 'destroy'
        working-directory: ${{ steps.guard.outputs.dir }}
        env:
          KEY: ${{ steps.guard.outputs.key }}
        run: |
          # A spike that was never applied has no state object at all; Terraform reports that as an error, which
          # here means "empty". Any other error fails the job.
          if ! terraform state list > "$OUT/state-after.txt" 2> "$OUT/state-after.err"; then
            grep -q "No state file was found" "$OUT/state-after.err" || { cat "$OUT/state-after.err"; exit 1; }
            : > "$OUT/state-after.txt"
          fi
          echo "terraform state list after destroy:"
          cat "$OUT/state-after.txt"
          if [[ -s "$OUT/state-after.txt" ]]; then
            {
              echo "### Destroy incomplete"
              echo ""
              echo "Still in \`$KEY\`:"
              echo '```'
              cat "$OUT/state-after.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::State $KEY is not empty after destroy."
            exit 1
          fi
          echo "### State \`$KEY\` is empty" >> "$GITHUB_STEP_SUMMARY"
