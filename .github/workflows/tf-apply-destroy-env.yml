name: terraform-per-env

# Manual Terraform plan / apply for infrastructure/main (interim, until release.yml + apply.yml replace it).
# There is deliberately no destroy action (plan H.7, ADR-0010).
# Adapted from the owner's existing pattern (workflow_dispatch, env JSON files read with jq, OIDC role, account guard).
# Changes: this repo's CI role and state bucket, S3 native locking, saved plan applied in the same job,
# no application secrets, Terraform version from the env files.

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        type: choice
        options:
          - prod
        default: prod
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  id-token: write # needed to request the GitHub OIDC token
  contents: read

concurrency:
  group: terraform-${{ inputs.env }} # one Terraform run per environment at a time
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-24.04
    # Fits inside the one-hour role session. The certificate validation waits up to 30 minutes for the
    # owner's DNS records (plan H.15.2, docs/runbooks/dns-hand-off.md).
    timeout-minutes: 60
    # The environment name becomes part of the OIDC subject (…:environment:prod), which the CI role trusts.
    # Add required reviewers to this environment in GitHub to make every run wait for your approval.
    environment:
      name: ${{ inputs.env }}
    defaults:
      run:
        shell: bash
        working-directory: infrastructure/main

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load shared and env-specific vars
        id: vars
        run: |
          COMMON_FILE="../envs/common.auto.tfvars.json"
          ENV_FILE="../envs/${{ inputs.env }}.tfvars.json"
          [[ -f "$COMMON_FILE" && -f "$ENV_FILE" ]] || { echo "Missing env files"; exit 1; }

          PROJECT=$(jq -r '.project' "$COMMON_FILE")
          REGION=$(jq -r '.region' "$COMMON_FILE")
          TF_VERSION=$(jq -r '.terraform_version' "$COMMON_FILE")
          ACCOUNT=$(jq -r '.aws_account_id' "$ENV_FILE")
          ENVIRONMENT=$(jq -r '.environment' "$ENV_FILE")
          for v in PROJECT REGION TF_VERSION ACCOUNT ENVIRONMENT; do
            [[ -n "${!v}" && "${!v}" != "null" ]] || { echo "$v is not set in the env files"; exit 1; }
          done

          # Must match infrastructure/bootstrap/locals.tf (state_bucket) and outputs.tf (CI role name).
          echo "bucket=${ENVIRONMENT}-state-bucket-${PROJECT}" >> "$GITHUB_OUTPUT"
          echo "role_arn=arn:aws:iam::${ACCOUNT}:role/${PROJECT}-${ENVIRONMENT}-github-oidc" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "tf_version=$TF_VERSION" >> "$GITHUB_OUTPUT"
          echo "var_files=-var-file=$COMMON_FILE -var-file=$ENV_FILE" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ steps.vars.outputs.role_arn }}
          aws-region: ${{ steps.vars.outputs.region }}

      - name: Verify AWS account and state bucket
        run: |
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          [[ "$ACTUAL" == "${{ steps.vars.outputs.account }}" ]] || { echo "Account mismatch: $ACTUAL"; exit 1; }
          aws s3api head-bucket --bucket "${{ steps.vars.outputs.bucket }}" \
            || { echo "State bucket ${{ steps.vars.outputs.bucket }} not found"; exit 1; }

      - name: Setup Terraform ${{ steps.vars.outputs.tf_version }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.vars.outputs.tf_version }}
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (S3 backend, native locking)
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${{ steps.vars.outputs.bucket }}" \
            -backend-config="key=main/terraform.tfstate" \
            -backend-config="region=${{ steps.vars.outputs.region }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan -input=false ${{ steps.vars.outputs.var_files }} -out=tfplan
          terraform show -no-color tfplan > plan.txt
          { echo '### Terraform plan (${{ inputs.action }})'; echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply (the exact saved plan)
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -input=false tfplan
