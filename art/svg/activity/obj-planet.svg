<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- obj-planet: a small blue planet with one tilted lilac ring (back half behind, front half in front). No face.
       Counting object. Single frame. Anchor centre (128,128). Light from the top-left. See art/STYLE.md. -->
  <defs>
    <clipPath id="planet-clip"><circle cx="128" cy="128" r="72"/></clipPath>
    <clipPath id="front-half"><rect x="0" y="128" width="256" height="128"/></clipPath>
  </defs>
  <g id="planet" stroke="#2A1E3D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <g id="ring-back" transform="rotate(-16 128 128)">
      <ellipse cx="128" cy="128" rx="104" ry="30" fill="none" stroke-width="26"/>
      <ellipse cx="128" cy="128" rx="104" ry="30" fill="none" stroke="#B98AF0" stroke-width="12"/>
    </g>
    <g id="globe">
      <circle cx="128" cy="128" r="72" fill="#5AA9F0"/>
      <g clip-path="url(#planet-clip)" stroke="none">
        <path d="M40 100 Q128 80 216 100 V116 Q128 96 40 116 Z" fill="#8CC7F6"/>
        <path d="M40 156 Q128 136 216 156 V168 Q128 148 40 168 Z" fill="#8CC7F6"/>
        <path id="globe-shade" d="M192 80 A72 72 0 0 1 110 196 Q196 190 192 80 Z" fill="#3F86CF"/>
      </g>
      <circle cx="128" cy="128" r="72" fill="none"/>
      <path id="globe-highlight" d="M74 112 Q80 82 106 68" fill="none" stroke="#FFFFFF" stroke-width="6"/>
      <circle cx="116" cy="66" r="3.5" fill="#FFFFFF" stroke="none"/>
    </g>
    <g id="ring-front" transform="rotate(-16 128 128)">
      <g clip-path="url(#front-half)">
        <ellipse cx="128" cy="128" rx="104" ry="30" fill="none" stroke-width="26"/>
        <ellipse cx="128" cy="128" rx="104" ry="30" fill="none" stroke="#B98AF0" stroke-width="12"/>
        <ellipse cx="128" cy="132" rx="104" ry="30" fill="none" stroke="#9670CC" stroke-width="5" stroke-dasharray="0 150 120 400"/>
      </g>
    </g>
  </g>
</svg>
