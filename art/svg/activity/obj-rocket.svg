<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- obj-rocket: a small upright white-and-orange rocket with a round window and three fins. No face, no flame.
       Counting object. Single frame. Anchor centre (128,128). Light from the top-left. See art/STYLE.md. -->
  <defs>
    <clipPath id="body-clip"><path d="M128 20 Q178 52 178 126 Q178 180 166 206 H90 Q78 180 78 126 Q78 52 128 20 Z"/></clipPath>
  </defs>
  <g id="rocket" stroke="#2A1E3D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <g id="fins-side" fill="#FF8A2A">
      <path d="M88 152 Q56 170 54 214 Q54 226 66 220 L94 202 Z"/>
      <path d="M168 152 Q200 170 202 214 Q202 226 190 220 L162 202 Z"/>
    </g>
    <rect id="nozzle" x="104" y="200" width="48" height="22" rx="7" fill="#A7B0C8"/>
    <g id="body">
      <path d="M128 20 Q178 52 178 126 Q178 180 166 206 H90 Q78 180 78 126 Q78 52 128 20 Z" fill="#F4F1EA"/>
      <g clip-path="url(#body-clip)">
        <path id="nose" d="M60 0 H200 V62 Q128 86 56 62 Z" fill="#FF8A2A" stroke="none"/>
        <path d="M56 62 Q128 86 200 62" fill="none" stroke-width="5"/>
        <path id="body-shade" d="M160 30 Q186 120 156 210 H190 V30 Z" fill="#2A1E3D" opacity="0.13" stroke="none"/>
      </g>
      <path d="M128 20 Q178 52 178 126 Q178 180 166 206 H90 Q78 180 78 126 Q78 52 128 20 Z" fill="none"/>
      <path id="body-highlight" d="M92 150 V112 Q94 92 100 80" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    </g>
    <g id="window">
      <circle cx="128" cy="122" r="25" fill="#A7B0C8"/>
      <circle cx="128" cy="122" r="15" fill="#8ED8FF" stroke-width="4"/>
      <path d="M119 120 Q120 113 126 111" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    </g>
    <rect id="fin-front" x="119" y="172" width="18" height="52" rx="9" fill="#FF8A2A"/>
  </g>
</svg>
