      <path d="M58 146 Q54 92 108 78 Q126 46 166 50 Q206 56 208 98 Q210 140 188 166 Q162 198 118 198 Q64 196 58 146 Z" fill="none"/>
      <path id="body-highlight" d="M72 128 Q78 104 98 92" fill="none" stroke="#BFE3FF" stroke-width="5"/>
    </g>
    <g id="wing">
