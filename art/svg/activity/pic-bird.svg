      <path d="M96 132 Q110 128 124 130" fill="none" stroke="#5AA9F0" stroke-width="4"/>
    </g>
    <path id="beak" d="M204 90 L228 100 L204 110 Z" fill="#FF8A2A" stroke-width="6"/>
