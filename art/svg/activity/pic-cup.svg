  <path d="M56 96 H200 Q202 174 128 182 Q54 174 56 96 Z" fill="none"/>
</g>
<ellipse id="rim" cx="128" cy="96" rx="72" ry="18" fill="#FFFFFF"/>
<ellipse id="tea" cx="128" cy="98" rx="60" ry="12" fill="#A9714B" stroke="none"/>
<path id="band" d="M60 124 Q128 144 196 124" fill="none" stroke="#FFFFFF" stroke-width="8"/>
<path d="M70 120 Q74 150 96 166" fill="none" stroke="#FFFFFF" stroke-width="7" opacity="0.85"/>
