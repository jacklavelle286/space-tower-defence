      <g clip-path="url(#body-clip)" stroke="none">
        <ellipse id="belly" cx="150" cy="166" rx="66" ry="24" fill="#FFC08A"/>
        <path id="body-shade" d="M222 60 V200 H120 Q200 180 222 60 Z" fill="#2A1E3D" opacity="0.13"/>
      </g>
      <g id="scales" fill="none" stroke="#D9661A" stroke-width="4">
