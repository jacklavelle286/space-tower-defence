      <path id="gill" d="M178 94 Q166 128 178 160" fill="none" stroke-width="4"/>
    </g>
    <g id="face" stroke="none">
      <circle cx="196" cy="112" r="12" fill="#FFFFFF" stroke="#2A1E3D" stroke-width="4"/>
      <circle cx="199" cy="113" r="6.5" fill="#2A1E3D"/>
      <circle cx="201" cy="110" r="2.2" fill="#FFFFFF"/>
      <path d="M208 138 Q214 143 220 136" fill="none" stroke="#2A1E3D" stroke-width="4"/>
