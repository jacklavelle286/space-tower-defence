    <clipPath id="body-clip"><ellipse cx="144" cy="128" rx="78" ry="54"/></clipPath>
  </defs>
  <g id="fish" stroke="#2A1E3D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <g id="fins-back" fill="#FFD23F">
      <path id="tail" d="M84 128 Q56 98 32 82 Q20 78 22 92 Q32 128 22 164 Q20 178 32 174 Q56 158 84 128 Z"/>
      <path id="fin-top" d="M100 84 Q124 38 178 60 Q182 70 176 80 Z"/>
      <path id="fin-bottom" d="M122 176 Q132 208 166 200 Q160 190 162 176 Z"/>
    </g>
    <g id="body">
