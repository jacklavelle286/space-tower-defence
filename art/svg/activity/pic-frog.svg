        <circle cx="90" cy="82" r="17" fill="#FFFFFF" stroke-width="5"/>
        <circle cx="166" cy="82" r="17" fill="#FFFFFF" stroke-width="5"/>
        <circle cx="94" cy="85" r="9" fill="#2A1E3D" stroke="none"/>
        <circle cx="170" cy="85" r="9" fill="#2A1E3D" stroke="none"/>
        <circle cx="97" cy="81" r="3.5" fill="#FFFFFF" stroke="none"/>
        <circle cx="173" cy="81" r="3.5" fill="#FFFFFF" stroke="none"/>
      </g>
      <g stroke="none">
        <circle cx="120" cy="116" r="2.8" fill="#2A1E3D"/>
        <circle cx="136" cy="116" r="2.8" fill="#2A1E3D"/>
        <ellipse cx="72" cy="140" rx="9" ry="6" fill="#F48A9A" opacity="0.75"/>
        <ellipse cx="184" cy="140" rx="9" ry="6" fill="#F48A9A" opacity="0.75"/>
      </g>
