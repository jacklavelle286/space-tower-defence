<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- pic-knight: a friendly cartoon knight in grey armour, open-face helmet with a red plume, holding a plain
       navy shield with a gold rim (no emblem, no heraldry). No sword, no weapon.
       Single frame. Anchor centre (128,128). Light from the top-left. See art/STYLE.md. -->
  <defs>
    <clipPath id="helmet-clip"><path d="M82 120 V86 Q82 42 128 42 Q174 42 174 86 V120 Q174 132 162 132 H94 Q82 132 82 120 Z"/></clipPath>
    <clipPath id="torso-clip"><rect x="84" y="128" width="88" height="72" rx="18"/></clipPath>
  </defs>
