<path id="map-outline" d="M34 66 L94 52 L162 66 L222 52 L222 200 L162 214 L94 200 L34 214 Z" fill="none"/>
<g id="fold-shade" stroke="none" fill="#2A1E3D" opacity="0.08"><path d="M94 52 L162 66 L162 214 L94 200 Z"/></g>
</g>
</svg>
