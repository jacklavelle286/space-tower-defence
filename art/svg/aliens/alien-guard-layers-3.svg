<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Bubble Guard bubble layer overlay, 3 layers: concentric translucent soap-bubble rings, empty centre.
       One shared construction for all four variants: band width 14, gap 6, outermost ring always r=120
       (rings outer/inner: 120/106, 100/86, 80/66, 60/46), so the bubble never changes size as layers pop.
       Anchor centre (128,128); the game scales it to each alien (32 to 256 px).
       Light from the top-left. See art/STYLE.md. -->
  <g id="bubble-layers" stroke-linecap="round">
    <g id="ring-1">
      <path d="M8 128 A120 120 0 1 1 248 128 A120 120 0 1 1 8 128 Z M22 128 A106 106 0 1 1 234 128 A106 106 0 1 1 22 128 Z" fill="#9FF3FF" fill-opacity="0.4" fill-rule="evenodd" stroke="none"/>
      <circle cx="128" cy="128" r="120" fill="none" stroke="#2A1E3D" stroke-opacity="0.5" stroke-width="4"/>
      <circle cx="128" cy="128" r="106" fill="none" stroke="#2A1E3D" stroke-opacity="0.5" stroke-width="3"/>
      <path d="M19.4 96.9 A113.0 113.0 0 0 1 52.4 44.0" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
      <circle cx="68.1" cy="32.2" r="3.5" fill="#FFFFFF" opacity="0.9"/>
      <path d="M234.2 166.6 A113.0 113.0 0 0 1 181.1 227.8" fill="none" stroke="#FFFFFF" stroke-width="4.0" stroke-linecap="round" opacity="0.55"/>
    </g>
    <g id="ring-2">
      <path d="M28 128 A100 100 0 1 1 228 128 A100 100 0 1 1 28 128 Z M42 128 A86 86 0 1 1 214 128 A86 86 0 1 1 42 128 Z" fill="#9FF3FF" fill-opacity="0.4" fill-rule="evenodd" stroke="none"/>
      <circle cx="128" cy="128" r="100" fill="none" stroke="#2A1E3D" stroke-opacity="0.5" stroke-width="4"/>
      <circle cx="128" cy="128" r="86" fill="none" stroke="#2A1E3D" stroke-opacity="0.5" stroke-width="3"/>
      <path d="M38.6 102.4 A93.0 93.0 0 0 1 65.8 58.9" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" opacity="0.9"/>
      <circle cx="78.7" cy="49.1" r="3.2" fill="#FFFFFF" opacity="0.9"/>
      <path d="M215.4 159.8 A93.0 93.0 0 0 1 171.7 210.1" fill="none" stroke="#FFFFFF" stroke-width="3.7" stroke-linecap="round" opacity="0.55"/>
    </g>
    <g id="ring-3">
      <path d="M48 128 A80 80 0 1 1 208 128 A80 80 0 1 1 48 128 Z M62 128 A66 66 0 1 1 194 128 A66 66 0 1 1 62 128 Z" fill="#9FF3FF" fill-opacity="0.4" fill-rule="evenodd" stroke="none"/>
      <circle cx="128" cy="128" r="80" fill="none" stroke="#2A1E3D" stroke-opacity="0.5" stroke-width="4"/>
      <circle cx="128" cy="128" r="66" fill="none" stroke="#2A1E3D" stroke-opacity="0.5" stroke-width="3"/>
      <path d="M57.8 107.9 A73.0 73.0 0 0 1 79.2 73.8" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
      <circle cx="89.3" cy="66.1" r="3" fill="#FFFFFF" opacity="0.9"/>
      <path d="M196.6 153.0 A73.0 73.0 0 0 1 162.3 192.5" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" opacity="0.55"/>
    </g>
  </g>
</svg>
