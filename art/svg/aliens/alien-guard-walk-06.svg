        </g>
      </g>
      <g id="arm-front" transform="rotate(8 172 216)"><path d="M172 216 Q186 222 188 232" fill="none" stroke="#2A1E3D" stroke-width="22"/><path d="M172 216 Q186 222 188 232" fill="none" stroke="#FFB38A" stroke-width="8"/></g>
    </g>
