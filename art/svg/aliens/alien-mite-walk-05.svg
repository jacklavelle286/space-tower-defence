        <g id="eyes">
          <ellipse cx="64" cy="66" rx="11" ry="13" fill="#FFFFFF" stroke-width="3"/>
          <ellipse cx="88" cy="64" rx="10" ry="12" fill="#FFFFFF" stroke-width="3"/>
          <g stroke="none">
            <circle cx="68" cy="69" r="6" fill="#2A1E3D"/><circle cx="91.5" cy="67" r="5.6" fill="#2A1E3D"/>
            <circle cx="70" cy="66" r="2.3" fill="#FFFFFF"/><circle cx="93.3" cy="64" r="2.1" fill="#FFFFFF"/>
