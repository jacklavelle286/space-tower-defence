<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Meteor Mite scurry, frame 05: contact, other side. Anchor bottom-centre (64,128): feet on y=122.
       Light from the top-left. See art/STYLE.md. -->
  <defs><clipPath id="mite-clip"><path d="M40 104 Q22 100 22 80 Q22 64 30 54 Q27 44 21 36 Q33 34 46 40 Q58 34 72 36 Q104 42 106 74 Q108 104 80 106 Z"/></clipPath></defs>
  <g id="mite" stroke="#2A1E3D" stroke-linecap="round" stroke-linejoin="round">
    <g id="trail" stroke-width="3">
      <g id="speed-lines" transform="translate(-2 0)" opacity="0.8">
        <path d="M12 52 L18 52" fill="none" stroke="#2A1E3D" stroke-width="8"/><path d="M12 52 L18 52" fill="none" stroke="#FFF4D6" stroke-width="3"/>
        <path d="M10 67 L18 67" fill="none" stroke="#2A1E3D" stroke-width="8"/><path d="M10 67 L18 67" fill="none" stroke="#FFF4D6" stroke-width="3"/>
        <path d="M12 82 L18 82" fill="none" stroke="#2A1E3D" stroke-width="8"/><path d="M12 82 L18 82" fill="none" stroke="#FFF4D6" stroke-width="3"/>
      </g>
      <g id="dust" opacity="0.75" transform="translate(18 114) scale(1.15) translate(-18 -114)">
        <circle cx="20" cy="114" r="6" fill="#C9C0F0"/>
        <circle cx="14" cy="107" r="4" fill="#C9C0F0"/>
      </g>
    </g>
    <g id="limbs-back">
      <g transform="translate(0 -0.00) rotate(12.00 40 98)"><path d="M40 98 L42 115" fill="none" stroke="#2A1E3D" stroke-width="15"/><path d="M40 98 L42 115" fill="none" stroke="#AA6C3E" stroke-width="5"/></g>
      <g transform="translate(0 -4.33) rotate(-12.00 70 98)"><path d="M70 98 L72 115" fill="none" stroke="#2A1E3D" stroke-width="15"/><path d="M70 98 L72 115" fill="none" stroke="#AA6C3E" stroke-width="5"/></g>
    </g>
    <g id="body" transform="translate(64 104) translate(0 -1) skewX(-6) scale(1.02 1.01) translate(-64 -104)">
      <path id="rock" d="M40 104 Q22 100 22 80 Q22 64 30 54 Q27 44 21 36 Q33 34 46 40 Q58 34 72 36 Q104 42 106 74 Q108 104 80 106 Z" fill="#D08A55" stroke="none"/>
      <g clip-path="url(#mite-clip)" stroke="none">
        <path id="rock-shade" d="M112 46 Q92 70 96 92 Q92 106 66 110 L114 114 Z" fill="#AA6C3E"/>
      </g>
      <path id="rock-highlight" d="M30 72 Q31 58 40 50" fill="none" stroke="#EDBB93" stroke-width="5"/>
      <g id="speckles" fill="#A8693C" stroke="none">
        <circle cx="40" cy="88" r="4"/><circle cx="52" cy="50" r="3"/><circle cx="48" cy="72" r="2.6"/><circle cx="96" cy="88" r="2.6"/>
      </g>
      <path id="rock-outline" d="M40 104 Q22 100 22 80 Q22 64 30 54 Q27 44 21 36 Q33 34 46 40 Q58 34 72 36 Q104 42 106 74 Q108 104 80 106 Z" fill="none" stroke-width="5"/>
