      <g transform="translate(0 -0.00) rotate(12.00 86 98)"><path d="M86 98 L88 115" fill="none" stroke="#2A1E3D" stroke-width="15"/><path d="M86 98 L88 115" fill="none" stroke="#D08A55" stroke-width="5"/></g>
