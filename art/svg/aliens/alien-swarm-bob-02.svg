<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Bubble Swarm bob, frame 02: rising. Anchor bottom-centre (32,64): base on y=57.
       Light from the top-left. See art/STYLE.md. -->
  <defs><clipPath id="swarm-clip"><circle cx="32" cy="38" r="19"/></clipPath></defs>
  <g id="swarm" transform="translate(32 57) translate(0 -1.5) scale(0.97 1.04) translate(-32 -57)" stroke="#2A1E3D" stroke-linecap="round" stroke-linejoin="round">
    <g id="body">
      <circle id="bubble" cx="32" cy="38" r="19" fill="#9FF3FF" stroke="none"/>
      <g clip-path="url(#swarm-clip)" stroke="none">
        <path id="bubble-shade" d="M56 22 Q46 34 48 46 Q44 56 30 60 L58 62 Z" fill="#74D3E2"/>
