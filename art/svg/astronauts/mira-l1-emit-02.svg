          <circle id="hair-bun" cx="104" cy="70" r="12" fill="#3B2A24"/>
          <path d="M98 66 Q100 62 105 61" fill="none" stroke="#6A5048" stroke-width="3"/>
          <circle id="face" cx="128" cy="98" r="29" fill="#A9714B"/>
          <path id="face-shade" clip-path="url(#face-clip)" d="M155 89 Q152 121 120 127 L160 129 Z" fill="#8A5A3A" stroke="none"/>
          <!-- smooth swept hair cap with a side parting -->
          <path id="fringe" d="M99 97 Q96 68 128 67 Q159 68 157 93 Q151 80 136 79 Q141 84 140 86 Q122 78 110 84 Q102 88 99 97 Z" fill="#3B2A24"/>
          <path d="M108 76 Q114 71 122 71" fill="none" stroke="#6A5048" stroke-width="3" stroke-linecap="round"/>
          <g id="face-features" stroke="none">
            <ellipse cx="120" cy="102" rx="4" ry="5.2" fill="#2A1E3D"/>
            <ellipse cx="142" cy="101" rx="4" ry="5.2" fill="#2A1E3D"/>
            <circle cx="121.4" cy="99.8" r="1.7" fill="#FFFFFF"/>
            <circle cx="143.4" cy="98.8" r="1.7" fill="#FFFFFF"/>
            <ellipse cx="110" cy="113" rx="6" ry="3.8" fill="#D9606E" opacity="0.6"/>
            <ellipse cx="152" cy="112" rx="4.6" ry="3.4" fill="#D9606E" opacity="0.6"/>
          </g>
          <!-- round glasses -->
          <g id="glasses" stroke-width="3">
            <circle cx="120" cy="101" r="9" fill="#FFFFFF" fill-opacity="0.22"/>
            <circle cx="142.5" cy="100" r="8.5" fill="#FFFFFF" fill-opacity="0.22"/>
            <path d="M129 100 Q131.3 97.5 134 99.5" fill="none"/>
            <path d="M111 99 L100 96" fill="none"/>
          </g>
          <path id="mouth" d="M124 114 Q133 121 143 113" fill="none" stroke-width="3.5"/>
        </g>
        <g id="visor-rim">
          <path d="M83 121 Q126 152 169 121" fill="none" stroke-width="16"/>
          <path d="M83 121 Q126 152 169 121" fill="none" stroke="#3DBE6E" stroke-width="9"/>
        </g>
        <g id="helmet-highlight" stroke="#FFFFFF" fill="none">
          <path d="M88 70 Q98 54 116 49" stroke-width="7" opacity="0.9"/>
          <circle cx="83" cy="84" r="1.5" stroke-width="5" opacity="0.9"/>
        </g>
        <circle id="helmet-outline" cx="126" cy="94" r="50" fill="none"/>
      </g>
      <g id="arm-front" transform="rotate(-80 158 148)">
        <path d="M158 148 Q180 156 188 174" fill="none" stroke-width="26"/>
        <path d="M158 148 Q180 156 188 174" fill="none" stroke="#F4F1EA" stroke-width="12"/>
        <g id="gadget" transform="rotate(58 190 179) translate(210 156) rotate(40)">
          <g transform="translate(0 0)">
            <circle id="lens-glow" cx="0" cy="-10.3" r="14" fill="#5BE0F0" opacity="0.6" stroke="none"/>
            <rect id="handle" x="-4.5" y="6" width="9" height="26" rx="4.5" fill="#A7B0C8" stroke-width="5"/>
            <path id="dish" d="M-25 0 Q-23 18 0 18 Q23 18 25 0 Z" fill="#F4F1EA" stroke-width="5"/>
            <path id="dish-band" d="M-19 9 Q0 14.4 19 9" fill="none" stroke="#3DBE6E" stroke-width="4"/>
            <ellipse id="dish-face" cx="0" cy="0" rx="25" ry="7" fill="#C9D0E2" stroke-width="5"/>
            <ellipse id="dish-glow" cx="0" cy="0" rx="20" ry="5.3" fill="#5BE0F0" opacity="0.35" stroke="none"/>
            <path id="feed" d="M0 0 V-9" fill="none" stroke-width="4"/>
            <circle id="lens" cx="0" cy="-10.3" r="4.5" fill="#5BE0F0" stroke-width="4"/>
            <circle cx="-1.5" cy="-11.8" r="1.4" fill="#FFFFFF" stroke="none"/>
          </g>
        </g>
        <g id="mitten-front" fill="#3DBE6E">
          <circle cx="190" cy="179" r="10.5"/>
          <ellipse cx="194" cy="169" rx="4" ry="5" stroke-width="4"/>
        </g>
      </g>
    </g>
  </g>
</svg>
