<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Mira (Shield Specialist) L1 emit, frame 02: 02 emitter raised above the shoulder towards the colony (up-right).
       Anchor bottom-centre (128,256): boot soles sit on y=250 (+3.5 outline). Light from the top-left. See art/STYLE.md. -->
  <defs>
    <clipPath id="torso-clip"><path d="M86 150 Q86 132 106 132 H148 Q166 132 166 150 V196 Q166 205 156 205 H96 Q86 205 86 196 Z"/></clipPath>
    <clipPath id="shield-clip"><path d="M91 151 Q126 138 161 151 V170 Q161 194 126 205 Q91 194 91 170 Z"/></clipPath>
    <clipPath id="face-clip"><circle cx="128" cy="98" r="29"/></clipPath>
  </defs>
  <g id="mira" stroke="#2A1E3D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <g id="body-back">
      <g id="backpack">
        <rect x="68" y="138" width="36" height="60" rx="13" fill="#A7B0C8"/>
        <path d="M74 184 Q74 192 84 192 H98" fill="none" stroke="#7F89A6" stroke-width="5"/>
      </g>
      <g id="legs">
        <rect x="97" y="190" width="25" height="42" rx="10" fill="#F4F1EA"/>
        <rect x="130" y="190" width="25" height="42" rx="10" fill="#F4F1EA"/>
        <rect x="101" y="210" width="17" height="10" rx="4" fill="#3DBE6E" stroke-width="4"/>
        <rect x="134" y="210" width="17" height="10" rx="4" fill="#3DBE6E" stroke-width="4"/>
      </g>
    </g>
    <g id="boots">
      <path d="M93 250 V236 Q93 226 103 226 H114 Q124 226 125 234 Q133 237 133 244 V250 Z" fill="#3DBE6E"/>
      <path d="M126 250 V236 Q126 226 136 226 H147 Q157 226 158 234 Q166 237 166 244 V250 Z" fill="#3DBE6E"/>
      <g stroke="none">
        <rect x="97" y="242" width="33" height="5" rx="2" fill="#2A9653"/>
        <rect x="130" y="242" width="33" height="5" rx="2" fill="#2A9653"/>
      </g>
      <path d="M99 236 Q99 231 104 231" fill="none" stroke="#8FE0AA" stroke-width="3.5"/>
      <path d="M132 236 Q132 231 137 231" fill="none" stroke="#8FE0AA" stroke-width="3.5"/>
    </g>
    <g id="body">
      <g id="arm-back">
        <path d="M92 146 Q74 164 80 190" fill="none" stroke-width="26"/>
        <path d="M92 146 Q74 164 80 190" fill="none" stroke="#F4F1EA" stroke-width="12"/>
        <g id="mitten-back" fill="#3DBE6E">
          <circle cx="80" cy="194" r="10.5"/>
          <ellipse cx="90" cy="190" rx="5" ry="4" stroke-width="4"/>
        </g>
      </g>
      <g id="torso">
        <path d="M86 150 Q86 132 106 132 H148 Q166 132 166 150 V196 Q166 205 156 205 H96 Q86 205 86 196 Z" fill="#F4F1EA"/>
        <g clip-path="url(#torso-clip)">
          <path id="torso-shade" d="M156 132 H170 V214 H140 Q158 186 156 132 Z" fill="#2A1E3D" opacity="0.13" stroke="none"/>
        </g>
        <path d="M86 150 Q86 132 106 132 H148 Q166 132 166 150 V196 Q166 205 156 205 H96 Q86 205 86 196 Z" fill="none"/>
        <!-- the big chest shield: green shield, white inner band, no symbols -->
        <g id="emblem">
          <path d="M91 151 Q126 138 161 151 V170 Q161 194 126 205 Q91 194 91 170 Z" fill="#3DBE6E" stroke-width="5"/>
          <g clip-path="url(#shield-clip)" stroke="none">
            <path id="emblem-shade" d="M150 140 H166 V208 H120 Q154 192 150 140 Z" fill="#2A9653"/>
          </g>
          <path id="emblem-band" d="M101 158 Q126 149 151 158 V171 Q151 189 126 197 Q101 189 101 171 Z" fill="none" stroke="#F4F1EA" stroke-width="5"/>
          <path d="M91 151 Q126 138 161 151 V170 Q161 194 126 205 Q91 194 91 170 Z" fill="none" stroke-width="5"/>
          <path id="emblem-highlight" d="M108 168 Q109 163 115 161" fill="none" stroke="#8FE0AA" stroke-width="4"/>
        </g>
        <path id="torso-highlight" d="M89 170 V156 Q89 148 94 145" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      </g>
      <ellipse id="collar" cx="127" cy="141" rx="33" ry="9" fill="#A7B0C8" stroke-width="6"/>
      <g id="helmet">
        <circle id="glass" cx="126" cy="94" r="50" fill="#CFE9FF" fill-opacity="0.6" stroke="none"/>
        <g id="head" stroke-width="4">
