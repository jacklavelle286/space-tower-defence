            <path d="M99.0 78.0 A9.2 9.2 0 0 1 91.8 92.9 A9.2 9.2 0 0 1 75.8 96.5 A9.2 9.2 0 0 1 62.9 86.2 A9.2 9.2 0 0 1 62.9 69.8 A9.2 9.2 0 0 1 75.8 59.5 A9.2 9.2 0 0 1 91.8 63.1 A9.2 9.2 0 0 1 99.0 78.0 Z"/>
            <path d="M193.9 84.5 A9.2 9.2 0 0 1 182.1 96.0 A9.2 9.2 0 0 1 165.7 94.0 A9.2 9.2 0 0 1 157.1 79.9 A9.2 9.2 0 0 1 162.7 64.4 A9.2 9.2 0 0 1 178.4 59.1 A9.2 9.2 0 0 1 192.2 68.1 A9.2 9.2 0 0 1 193.9 84.5 Z"/>
          </g>
