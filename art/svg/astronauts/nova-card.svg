            <ellipse cx="144" cy="112" rx="7" ry="9" fill="#2A1E3D"/>
            <circle cx="114.5" cy="108" r="2.9" fill="#FFFFFF"/>
            <circle cx="146.5" cy="108" r="2.9" fill="#FFFFFF"/>
            <ellipse cx="97" cy="128" rx="9" ry="6" fill="#F48A9A" opacity="0.75"/>
            <ellipse cx="159" cy="128" rx="9" ry="6" fill="#F48A9A" opacity="0.75"/>
          </g>
