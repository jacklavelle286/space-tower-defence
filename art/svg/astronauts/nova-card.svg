<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Nova (Laser Scout) shop portrait, L1 look: head and shoulders facing the viewer, big grin, laser lens peeking
       in at the bottom right. Anchor centre (128,128). Light from the top-left. See art/STYLE.md. -->
  <defs>
    <clipPath id="shoulder-clip"><path d="M34 246 V214 Q34 180 76 176 H180 Q222 180 222 214 V246 Z"/></clipPath>
    <clipPath id="face-clip"><circle cx="128" cy="110" r="47"/></clipPath>
  </defs>
  <g id="nova" stroke="#2A1E3D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <g id="body">
      <g id="torso">
        <path d="M34 246 V214 Q34 180 76 176 H180 Q222 180 222 214 V246 Z" fill="#F4F1EA"/>
        <g clip-path="url(#shoulder-clip)" stroke="none">
          <path id="chevron" d="M20 238 L240 178 L240 210 L20 270 Z" fill="#FF8A2A" stroke="#2A1E3D" stroke-width="5"/>
          <path id="torso-shade" d="M196 176 H230 V250 H170 Q206 220 196 176 Z" fill="#2A1E3D" opacity="0.13"/>
        </g>
        <path d="M34 246 V214 Q34 180 76 176 H180 Q222 180 222 214 V246 Z" fill="none"/>
        <path id="torso-highlight" d="M46 222 V212 Q46 196 60 190" fill="none" stroke="#FFFFFF" stroke-width="5"/>
      </g>
      <ellipse id="collar" cx="128" cy="180" rx="60" ry="15" fill="#A7B0C8" stroke-width="6"/>
      <g id="gadget" transform="rotate(-35 196 232)">
        <circle id="lens-glow" cx="232" cy="223" r="15" fill="#FFE79A" opacity="0.6" stroke="none"/>
        <rect x="184" y="210" width="40" height="26" rx="12" fill="#F4F1EA" stroke-width="6"/>
        <path d="M201 211 V235" fill="none" stroke="#FF8A2A" stroke-width="8" stroke-linecap="butt"/>
        <rect x="184" y="210" width="40" height="26" rx="12" fill="none" stroke-width="6"/>
        <circle id="lens" cx="226" cy="223" r="11" fill="#FFF4D6" stroke-width="5"/>
        <circle cx="223" cy="220" r="3" fill="#FFFFFF" stroke="none"/>
      </g>
      <g id="mitten-front" fill="#FF8A2A">
