          <path id="face-shade" clip-path="url(#face-clip)" d="M172 96 Q170 146 116 160 L180 162 Z" fill="#F2C3AA" stroke="none"/>
          <path id="fringe" d="M82 106 Q80 62 128 61 Q176 62 174 106 Q168 92 158 95 Q151 81 140 88 Q129 77 117 88 Q105 81 98 95 Q88 92 82 106 Z" fill="#1E1A24"/>
          <g id="face-features" stroke="none">
