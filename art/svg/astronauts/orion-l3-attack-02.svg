        <path d="M94 154 Q118 188 182 162" fill="none" stroke-width="26"/>
        <path d="M94 154 Q118 188 182 162" fill="none" stroke="#F4F1EA" stroke-width="12"/>
        <g id="stripes-back" fill="none" stroke-linecap="butt">
          <path d="M94 154 Q97.5 159 101.5 163.5" stroke="#2E4A9E" stroke-width="12"/>
          <path d="M101.5 163.5 Q104 166.4 106.7 168.8" stroke="#FFD86B" stroke-width="12"/>
        </g>
      </g>
      <g id="arm-front">
        <g id="arm-front-band" transform="rotate(-3 158 148)">
        <path d="M158 148 Q178 158 190 172" fill="none" stroke-width="26"/>
        <path d="M158 148 Q178 158 190 172" fill="none" stroke="#F4F1EA" stroke-width="12"/>
        <g id="stripes-front" fill="none" stroke-linecap="butt">
          <path d="M158 148 Q163 150.5 167 153" stroke="#2E4A9E" stroke-width="12"/>
          <path d="M167 153 Q170.5 155 173.5 157.5" stroke="#FFD86B" stroke-width="12"/>
        </g>
        </g>
        <g id="gadget" transform="rotate(-4 196 150) rotate(8 196 174) translate(0 22)">
