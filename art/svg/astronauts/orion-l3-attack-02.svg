            <path transform="translate(104.0 156.0)" d="M0 -9.0 Q2.5 -2.5 9.0 0 Q2.5 2.5 0 9.0 Q-2.5 2.5 -9.0 0 Q-2.5 -2.5 0 -9.0 Z" fill="#FFD86B"/>
            <path transform="translate(140.0 148.0)" d="M0 -6.0 Q1.7 -1.7 6.0 0 Q1.7 1.7 0 6.0 Q-1.7 1.7 -6.0 0 Q-1.7 -1.7 0 -6.0 Z" fill="#FFD86B"/>
            <path transform="translate(128.0 176.0)" d="M0 -7.5 Q2.1 -2.1 7.5 0 Q2.1 2.1 0 7.5 Q-2.1 2.1 -7.5 0 Q-2.1 -2.1 0 -7.5 Z" fill="#FFD86B"/>
            <path transform="translate(153.0 186.0)" d="M0 -6.0 Q1.7 -1.7 6.0 0 Q1.7 1.7 0 6.0 Q-1.7 1.7 -6.0 0 Q-1.7 -1.7 0 -6.0 Z" fill="#FFD86B"/>
          </g>
          <path id="torso-shade" d="M156 132 H170 V214 H140 Q158 186 156 132 Z" fill="#22377A" opacity="0.85"/>
        </g>
        <path d="M86 150 Q86 132 106 132 H148 Q166 132 166 150 V196 Q166 205 156 205 H96 Q86 205 86 196 Z" fill="none"/>
        <path id="torso-highlight" d="M95 168 V152 Q95 143 103 141" fill="none" stroke="#5C78C8" stroke-width="4.48"/>
        <g id="star-patch">
