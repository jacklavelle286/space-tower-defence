<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Orion (Orbit Ranger) L3 attack, frame 02 of 06: 02 lift: Orion tilts the telescope up a little, looking up.
       Anchor bottom-centre (128,256): boot soles sit on y=250. Light from the top-left. See art/STYLE.md. L3: longest telescope with a glowing gold ring at the front; star-chart visor; navy-and-gold shoulder stripes.
       Generated from the Orion L1 idle drawing (same parts, same scale: outline 7, bands 26/12, visor 16/9). -->
  <defs>
    <clipPath id="torso-clip"><path d="M86 150 Q86 132 106 132 H148 Q166 132 166 150 V196 Q166 205 156 205 H96 Q86 205 86 196 Z"/></clipPath>
    <clipPath id="face-clip"><circle cx="128" cy="98" r="29"/></clipPath>
    <clipPath id="tube-clip"><rect x="188" y="130" width="16" height="84" rx="5"/></clipPath>
    <clipPath id="brass-clip"><rect x="184" y="82" width="24" height="44" rx="6"/></clipPath>
    <clipPath id="hood-clip"><path d="M183 88 L177 54 Q176 48 182 48 H210 Q216 48 215 54 L209 88 Z"/></clipPath>
  </defs>
  <g id="orion" stroke="#2A1E3D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
