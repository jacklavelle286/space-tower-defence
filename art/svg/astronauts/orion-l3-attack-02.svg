            <rect clip-path="url(#tube-clip)" x="198" y="130" width="7" height="84" fill="#22377A" stroke="none"/>
            <rect x="188" y="130" width="16" height="84" rx="5" fill="none"/>
            <path d="M193 140 V202" fill="none" stroke="#5C78C8" stroke-width="3.52"/>
          </g>
          <g id="drawtube">
          <rect x="189" y="86" width="14" height="42" rx="4" fill="#A7B0C8" stroke-width="6"/>
          <rect x="197" y="89" width="4" height="36" rx="2" fill="#7F89A6" stroke="none"/>
          <path d="M193 92 V122" fill="none" stroke="#C9D0E2" stroke-width="3"/>
          <rect x="186" y="103" width="20" height="8" rx="3" fill="#FFD86B" stroke-width="5"/>
          </g>
          <g id="brass" transform="translate(0 -34)">
            <rect x="184" y="82" width="24" height="44" rx="6" fill="#FFD86B"/>
            <rect clip-path="url(#brass-clip)" x="200" y="82" width="9" height="44" fill="#E0AE1F" stroke="none"/>
            <rect x="184" y="82" width="24" height="44" rx="6" fill="none"/>
            <path d="M189 92 V110" fill="none" stroke="#FFFFFF" stroke-width="3.52"/>
          </g>
          <rect id="ring" x="185" y="122" width="22" height="10" rx="4" fill="#FFD86B" stroke-width="5"/>
          <rect id="ring-2" x="186" y="88" width="20" height="9" rx="4" fill="#FFD86B" stroke-width="5"/>
          <g id="hood" transform="translate(0 -34) translate(196 88) scale(1.15) translate(-196 -88)" stroke-width="6.09">
            <path d="M183 88 L177 54 Q176 48 182 48 H210 Q216 48 215 54 L209 88 Z" fill="#2E4A9E"/>
            <path clip-path="url(#hood-clip)" d="M204 48 H218 V90 H200 Z" fill="#22377A" stroke="none"/>
            <path d="M183 88 L177 54 Q176 48 182 48 H210 Q216 48 215 54 L209 88 Z" fill="none"/>
            <path d="M178 60 H214" fill="none" stroke="#FFD86B" stroke-width="3.90" stroke-linecap="butt"/>
            <path d="M184 70 L186 82" fill="none" stroke="#5C78C8" stroke-width="3.06"/>
          </g>
          <ellipse id="gold-ring" cx="196" cy="9.2" rx="26.7" ry="12.0" fill="#FFD86B" stroke-width="5"/>
          <ellipse id="lens" cx="196" cy="9.2" rx="20.7" ry="8.0" fill="#FFF4D6" stroke-width="5"/>
          <path d="M184.6 8.2 Q187.7 4.3 193.9 4.3" fill="none" stroke="#FFFFFF" stroke-width="3"/>
        </g>
        <g id="mitten-back" fill="#2E4A9E">
          <circle cx="196" cy="150" r="10.5"/>
          <ellipse cx="190" cy="141" rx="4" ry="5" stroke-width="4"/>
        </g>
        <g id="mitten-front-hold" transform="rotate(-3 158 148)">
        <g id="mitten-front" fill="#2E4A9E">
          <circle cx="193" cy="177" r="10.5"/>
          <ellipse cx="202" cy="170" rx="4" ry="5" stroke-width="4"/>
        </g>
        </g>
      </g>
      <g id="helmet">
        <circle id="glass" cx="126" cy="94" r="50" fill="#CFE9FF" fill-opacity="0.6" stroke="none"/>
        <g id="star-chart" stroke="none" opacity="0.85">
