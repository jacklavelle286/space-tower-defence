          <path d="M139 50 L154 56 L163 67 L170 81 M154 56 L150 66" fill="none" stroke="#FFF4D6" stroke-width="2.5" opacity="0.85"/>
          <circle cx="139" cy="50" r="3.2" fill="#FFF4D6"/>
          <circle cx="154" cy="56" r="3.8" fill="#FFD86B"/>
          <circle cx="163" cy="67" r="3.2" fill="#FFF4D6"/>
          <circle cx="170" cy="81" r="3.6" fill="#FFD86B"/>
          <circle cx="150" cy="66" r="2.2" fill="#FFF4D6"/>
          <path d="M93 102 L88 116 L98 126" fill="none" stroke="#FFF4D6" stroke-width="2.5" opacity="0.85"/>
          <circle cx="88" cy="116" r="3.2" fill="#FFF4D6"/>
        </g>
        <g id="head" transform="translate(1 -2)" stroke-width="4">
          <!-- wavy dark hair: a back mass behind the face with a wavy edge -->
          <path id="hair-back" d="M97 108 Q88 96 94 84 Q90 72 101 66 Q104 56 117 57 Q126 50 137 56 Q150 54 155 64 Q166 70 162 84 Q166 95 158 104 Z" fill="#3B2A24"/>
          <circle id="face" cx="128" cy="98" r="29" fill="#F1CDB2"/>
          <path id="face-shade" clip-path="url(#face-clip)" d="M155 89 Q152 121 120 127 L160 129 Z" fill="#E2B394" stroke="none"/>
          <!-- side-swept wavy fringe -->
          <path id="fringe" d="M99 96 Q96 68 126 66 Q156 66 158 90 Q152 80 144 82 Q138 74 128 80 Q118 74 110 82 Q104 84 99 96 Z" fill="#3B2A24"/>
          <path d="M112 72 Q120 68 128 71" fill="none" stroke="#5A463C" stroke-width="3"/>
          <!-- bright teal hearing aid on the near cheek edge -->
          <g id="hearing-aid">
            <path d="M102 92 Q98 95 100 99" fill="none" stroke-width="3"/>
            <circle cx="101" cy="104" r="5" fill="#3FB8AF" stroke="#2A1E3D" stroke-width="3"/>
            <circle cx="99.5" cy="102.5" r="1.3" fill="#FFFFFF" stroke="none"/>
          </g>
          <g id="face-features" stroke="none">
            <ellipse cx="120" cy="101" rx="4.6" ry="6" fill="#2A1E3D"/>
            <ellipse cx="142" cy="100" rx="4.6" ry="6" fill="#2A1E3D"/>
            <circle cx="122.4" cy="97.6" r="1.9" fill="#FFFFFF"/>
            <circle cx="144.4" cy="96.6" r="1.9" fill="#FFFFFF"/>
            <ellipse cx="111" cy="110" rx="6" ry="3.8" fill="#F48A9A" opacity="0.75"/>
            <ellipse cx="152" cy="109" rx="4.5" ry="3.4" fill="#F48A9A" opacity="0.75"/>
          </g>
          <path id="mouth" d="M125 113 Q134 119 143 112" fill="none" stroke-width="3.52"/>
        </g>
        <g id="visor-rim">
          <path d="M83 121 Q126 152 169 121" fill="none" stroke-width="16"/>
          <path d="M83 121 Q126 152 169 121" fill="none" stroke="#2E4A9E" stroke-width="9"/>
        </g>
        <g id="helmet-highlight" stroke="#FFFFFF" fill="none">
          <path d="M88 70 Q98 54 116 49" stroke-width="7" opacity="0.9"/>
          <circle cx="83" cy="84" r="1.5" stroke-width="5" opacity="0.9"/>
        </g>
        <circle id="helmet-outline" cx="126" cy="94" r="50" fill="none"/>
      </g>
    </g>
  </g>
</svg>
