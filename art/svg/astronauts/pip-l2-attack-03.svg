<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Pip (Frost Explorer) L2 attack, frame 03: 03 small happy bounce, sparkle fading. L2 upgrade: canisters ~1.5x and glowing, shoulder snowflakes, larger wand tip.
       Anchor bottom-centre (128,256): boot soles sit on y=250 (+3.5 outline). Light from the top-left. See art/STYLE.md. -->
  <defs>
    <clipPath id="torso-clip"><path d="M86 150 Q86 132 106 132 H148 Q166 132 166 150 V196 Q166 205 156 205 H96 Q86 205 86 196 Z"/></clipPath>
    <clipPath id="face-clip"><circle cx="128" cy="98" r="29"/></clipPath>
    <clipPath id="canister-near-clip"><circle cx="60" cy="121" r="35"/></clipPath>
    <clipPath id="canister-far-clip"><circle cx="78" cy="85" r="25"/></clipPath>
  </defs>
  <g id="pip" stroke="#2A1E3D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <g id="body-back" transform="translate(0 -3)">
      <g id="backpack">
        <rect x="68" y="138" width="36" height="60" rx="13" fill="#A7B0C8"/>
        <path d="M74 184 Q74 192 84 192 H98" fill="none" stroke="#7F89A6" stroke-width="5"/>
      </g>
      <g id="canisters">
        <!-- far canister: second bubble behind and above the near one, on the backpack side (L2: about 1.5x bigger, glowing faintly) -->
        <g id="canister-far">
          <circle cx="78" cy="85" r="34" fill="#CFF6FF" opacity="0.45" stroke="none"/>
          <rect x="71" y="55.2" width="14" height="9" rx="4" fill="#A7B0C8" stroke-width="5"/>
          <circle cx="78" cy="85" r="25" fill="#8ED8FF"/>
          <circle cx="80" cy="86.5" r="13.8" fill="#D2F0FF" opacity="0.55" stroke="none"/>
          <path clip-path="url(#canister-far-clip)" d="M101.6 69.7 Q101.6 108.6 62.7 111.4 L109.9 121.1 Z" fill="#5FB4E6" stroke="none"/>
          <circle cx="78" cy="85" r="25" fill="none"/>
          <path d="M61.3 82.2 Q62.7 69.7 73.8 66.9" fill="none" stroke="#FFFFFF" stroke-width="4"/>
        </g>
        <!-- near canister: big frosted bubble on the back, viewer's left -->
        <g id="canister-near">
          <circle cx="60" cy="121" r="44" fill="#CFF6FF" opacity="0.45" stroke="none"/>
          <rect x="48" y="78.8" width="22" height="13" rx="4" fill="#A7B0C8" stroke-width="5"/>
          <circle cx="60" cy="121" r="35" fill="#8ED8FF"/>
          <circle cx="62.8" cy="123.1" r="19.2" fill="#D2F0FF" opacity="0.55" stroke="none"/>
          <path clip-path="url(#canister-near-clip)" d="M92.2 98.6 Q95 154.6 40.4 158.8 L102 171.4 Z" fill="#5FB4E6" stroke="none"/>
          <circle cx="60" cy="121" r="35" fill="none"/>
          <path d="M37.6 122.4 Q37.6 101.4 55.8 95.8" fill="none" stroke="#FFFFFF" stroke-width="5"/>
          <circle cx="40.4" cy="135" r="1.2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3.5"/>
        </g>
      </g>
      <g id="legs">
        <rect x="97" y="190" width="25" height="42" rx="10" fill="#F4F1EA"/>
        <rect x="130" y="190" width="25" height="42" rx="10" fill="#F4F1EA"/>
        <rect x="101" y="210" width="17" height="10" rx="4" fill="#8ED8FF" stroke-width="4"/>
        <rect x="134" y="210" width="17" height="10" rx="4" fill="#8ED8FF" stroke-width="4"/>
      </g>
    </g>
    <g id="boots">
      <path d="M93 250 V236 Q93 226 103 226 H114 Q124 226 125 234 Q133 237 133 244 V250 Z" fill="#8ED8FF"/>
      <path d="M126 250 V236 Q126 226 136 226 H147 Q157 226 158 234 Q166 237 166 244 V250 Z" fill="#8ED8FF"/>
      <g stroke="none">
        <rect x="97" y="242" width="33" height="5" rx="2" fill="#5FB4E6"/>
        <rect x="130" y="242" width="33" height="5" rx="2" fill="#5FB4E6"/>
      </g>
      <path d="M99 236 Q99 231 104 231" fill="none" stroke="#D2F0FF" stroke-width="3.5"/>
      <path d="M132 236 Q132 231 137 231" fill="none" stroke="#D2F0FF" stroke-width="3.5"/>
    </g>
    <g id="body" transform="translate(0 -3)">
      <g id="arm-back">
        <path d="M92 146 Q74 164 80 190" fill="none" stroke-width="26"/>
        <path d="M92 146 Q74 164 80 190" fill="none" stroke="#F4F1EA" stroke-width="12"/>
        <g id="mitten-back" fill="#8ED8FF">
          <circle cx="80" cy="194" r="10.5"/>
          <ellipse cx="90" cy="190" rx="5" ry="4" stroke-width="4"/>
        </g>
      </g>
      <g id="torso">
        <path d="M86 150 Q86 132 106 132 H148 Q166 132 166 150 V196 Q166 205 156 205 H96 Q86 205 86 196 Z" fill="#8ED8FF"/>
        <g clip-path="url(#torso-clip)">
          <!-- white belt panel across the lower torso -->
          <rect x="80" y="186" width="92" height="24" fill="#F4F1EA" stroke-width="4.5"/>
          <path id="torso-shade" d="M156 132 H170 V214 H140 Q158 186 156 132 Z" fill="#2A1E3D" opacity="0.13" stroke="none"/>
        </g>
        <path d="M86 150 Q86 132 106 132 H148 Q166 132 166 150 V196 Q166 205 156 205 H96 Q86 205 86 196 Z" fill="none"/>
        <path id="torso-highlight" d="M95 168 V152 Q95 143 103 141" fill="none" stroke="#D2F0FF" stroke-width="4.5"/>
        <g id="emblem">
          <circle cx="128" cy="167" r="15" fill="#F4F1EA" stroke-width="4"/>
          <g fill="none" stroke="#5FB4E6" stroke-width="3.5">
            <path d="M128 157 V177 M119.3 162 L136.7 172 M119.3 172 L136.7 162"/>
          </g>
          <circle cx="128" cy="167" r="3" fill="#5FB4E6" stroke="none"/>
        </g>
      </g>
      <ellipse id="collar" cx="127" cy="141" rx="33" ry="9" fill="#A7B0C8" stroke-width="6"/>
      <!-- L2+: snowflake patch on each shoulder -->
      <g id="shoulder-snowflakes">
        <g transform="translate(97 154)"><circle r="8.5" fill="#F4F1EA" stroke-width="4"/><path d="M0 -5 V5 M-4.3 -2.5 L4.3 2.5 M-4.3 2.5 L4.3 -2.5" fill="none" stroke="#5FB4E6" stroke-width="3"/></g>
      </g>
      <g id="arm-front" transform="rotate(1 158 148)">
        <path d="M158 148 Q178 156 186 174" fill="none" stroke-width="26"/>
        <path d="M158 148 Q178 156 186 174" fill="none" stroke="#F4F1EA" stroke-width="12"/>
        <g id="shoulder-front"><g transform="translate(164 153)"><circle r="9.5" fill="#F4F1EA" stroke-width="4"/><path d="M0 -6 V6 M-5.2 -3 L5.2 3 M-5.2 3 L5.2 -3" fill="none" stroke="#5FB4E6" stroke-width="3"/></g></g>
        <g id="gadget" transform="rotate(11 189 177)">
          <circle id="tip-glow" cx="203.5" cy="107" r="20" fill="#CFF6FF" opacity="0.55" stroke="none"/>
          <!-- short wand, held upright beside him -->
          <path d="M190 182 L201.5 124" fill="none" stroke-width="14"/>
          <path d="M190 182 L201.5 124" fill="none" stroke="#A7B0C8" stroke-width="6"/>
          <!-- snowflake crystal tip: three crossed outlined arms -->
          <g id="wand-tip">
            <path d="M203.5 92 V122 M190.5 99.5 L216.5 114.5 M190.5 114.5 L216.5 99.5" fill="none" stroke-width="13"/>
            <path d="M203.5 92 V122 M190.5 99.5 L216.5 114.5 M190.5 114.5 L216.5 99.5" fill="none" stroke="#CFF6FF" stroke-width="5"/>
            <circle cx="203.5" cy="107" r="4.5" fill="#8ED8FF" stroke="none"/>
            <circle cx="201.5" cy="93.5" r="1" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5"/>
          </g>
          <g id="frost-sparkles" opacity="0.6">
            <path d="M217.3 77.1 Q219.2 82.1 224.2 84 Q219.2 85.9 217.3 90.9 Q215.4 85.9 210.4 84 Q215.4 82.1 217.3 77.1 Z" fill="#CFF6FF" stroke="none"/>
            <path d="M220.8 115 Q222.4 119.2 226.5 120.8 Q222.4 122.4 220.8 126.5 Q219.1 122.4 215 120.8 Q219.1 119.2 220.8 115 Z" fill="#FFF4D6" stroke="none"/>
            <circle cx="226.5" cy="103" r="2.4" fill="#FFFFFF" stroke="none"/>
          </g>
        </g>
        <g id="mitten-front" fill="#8ED8FF">
          <circle cx="189" cy="177" r="10.5"/>
          <ellipse cx="181" cy="171" rx="4" ry="5" stroke-width="4"/>
        </g>
      </g>
      <g id="helmet">
        <circle id="glass" cx="126" cy="94" r="50" fill="#CFE9FF" fill-opacity="0.6" stroke="none"/>
        <g id="head" stroke-width="4">
          <circle id="face" cx="128" cy="98" r="29" fill="#FBE4D5"/>
          <path id="face-shade" clip-path="url(#face-clip)" d="M155 89 Q152 121 120 127 L160 129 Z" fill="#EFC6AE" stroke="none"/>
          <!-- tufty ginger hair: a cap with three rounded tufts sticking up -->
          <path id="fringe" d="M99 93 Q97 74 110 68 Q106 59 115 55 Q117 63 124 64 Q126 53 137 53 Q134 61 140 65 Q148 60 153 64 Q148 68 150 72 Q158 79 157 91 Q152 82 144 85 Q140 77 132 82 Q125 76 118 82 Q110 77 99 93 Z" fill="#E07A3C"/>
          <path d="M108 77 Q113 70 121 69" fill="none" stroke="#F4A673" stroke-width="3" />
          <g id="face-features" stroke="none">
            <ellipse cx="120" cy="101" rx="4.6" ry="6" fill="#2A1E3D"/>
            <ellipse cx="142" cy="100" rx="4.6" ry="6" fill="#2A1E3D"/>
            <circle cx="121.6" cy="98.3" r="1.9" fill="#FFFFFF"/>
            <circle cx="143.6" cy="97.3" r="1.9" fill="#FFFFFF"/>
            <!-- round cheeks, a little bigger than Nova's -->
            <ellipse cx="111" cy="111" rx="7.5" ry="5" fill="#F48A9A" opacity="0.75"/>
            <ellipse cx="152" cy="110" rx="5.8" ry="4.4" fill="#F48A9A" opacity="0.75"/>
            <!-- freckles over the nose and cheeks -->
            <g id="freckles" fill="#B5653F">
              <circle cx="106.5" cy="106" r="2.2"/>
              <circle cx="112.5" cy="105" r="2.2"/>
              <circle cx="109.5" cy="110" r="2.2"/>
              <circle cx="148.5" cy="106.5" r="2.2"/>
              <circle cx="153.5" cy="105" r="2.2"/>
              <circle cx="151" cy="110" r="2.2"/>
            </g>
          </g>
          <!-- playful smile with a little tongue -->
          <path id="mouth" d="M124 111 Q134 116 144 110 Q142 121 134 121 Q126 121 124 111 Z" fill="#FFFFFF" stroke-width="3.5"/>
          <path d="M128 118 Q134 115 140 118 Q137 120.5 134 120.5 Q131 120.5 128 118 Z" fill="#F27C8C" stroke="none"/>
        </g>
        <g id="visor-rim">
          <path d="M83 121 Q126 152 169 121" fill="none" stroke-width="16"/>
          <path d="M83 121 Q126 152 169 121" fill="none" stroke="#8ED8FF" stroke-width="9"/>
        </g>
        <g id="helmet-highlight" stroke="#FFFFFF" fill="none">
          <path d="M88 70 Q98 54 116 49" stroke-width="7" opacity="0.9"/>
          <circle cx="83" cy="84" r="1.5" stroke-width="5" opacity="0.9"/>
        </g>
        <circle id="helmet-outline" cx="126" cy="94" r="50" fill="none"/>
      </g>
    </g>
  </g>
</svg>
