<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Sol locked silhouette: flat night-blue (#23295E) fill of the sol-card shape plus a 7 px plum outline.
       The antenna and beacon bulb show in the outline shape. Anchor centre (128,128). -->
  <g id="sol-card-locked" stroke-linejoin="round" stroke-linecap="round">
    <g id="outline">
      <path d="M60 214 L42 52" fill="none" stroke="#2A1E3D" stroke-width="26"/>
      <circle cx="40" cy="36" r="15" fill="#2A1E3D" stroke="#2A1E3D" stroke-width="14"/>
      <rect x="32" y="46" width="18" height="10" rx="4" fill="#2A1E3D" stroke="#2A1E3D" stroke-width="14"/>
      <rect x="30" y="184" width="44" height="66" rx="15" fill="#2A1E3D" stroke="#2A1E3D" stroke-width="14"/>
      <path d="M38 250 V230 Q38 194 78 190 H178 Q218 194 218 230 V250 Z" fill="#2A1E3D" stroke="#2A1E3D" stroke-width="14"/>
      <ellipse cx="128" cy="194" rx="48" ry="12" fill="#2A1E3D" stroke="#2A1E3D" stroke-width="14"/>
      <circle cx="128" cy="126" r="68" fill="#2A1E3D" stroke="#2A1E3D" stroke-width="14"/>
    </g>
    <g id="fill" stroke="none">
      <path d="M60 214 L42 52" fill="none" stroke="#23295E" stroke-width="12"/>
      <circle cx="40" cy="36" r="15" fill="#23295E"/>
      <rect x="32" y="46" width="18" height="10" rx="4" fill="#23295E"/>
      <rect x="30" y="184" width="44" height="66" rx="15" fill="#23295E"/>
      <path d="M38 250 V230 Q38 194 78 190 H178 Q218 194 218 230 V250 Z" fill="#23295E"/>
      <ellipse cx="128" cy="194" rx="48" ry="12" fill="#23295E"/>
      <circle cx="128" cy="126" r="68" fill="#23295E"/>
    </g>
  </g>
</svg>
