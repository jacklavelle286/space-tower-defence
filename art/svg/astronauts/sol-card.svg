<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Sol (Beacon Commander) shop portrait (L1 look): head and shoulders facing the viewer, warm grin, grey beard,
       antenna and gold beacon bulb rising above the helmet on the viewer's left. Anchor centre (128,128). See art/STYLE.md. -->
  <defs>
    <clipPath id="face-clip-f"><circle cx="128" cy="99" r="29"/></clipPath>
    <clipPath id="bust-clip"><path d="M38 250 V230 Q38 194 78 190 H178 Q218 194 218 230 V250 Z"/></clipPath>
    <clipPath id="bulb-clip"><circle cx="40" cy="36" r="15"/></clipPath>
  </defs>
  <g id="sol-card" stroke="#2A1E3D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <g id="antenna">
      <path d="M60 214 L42 52" fill="none" stroke-width="12"/>
      <path d="M60 214 L42 52" fill="none" stroke="#A7B0C8" stroke-width="5"/>
      <path d="M54.5 165 L49.2 117" fill="none" stroke="#E2403A" stroke-width="5" stroke-linecap="butt"/>
      <rect x="32" y="46" width="18" height="10" rx="4" fill="#A7B0C8" stroke-width="4"/>
      <g id="beacon">
        <circle id="beacon-glow" cx="40" cy="36" r="23" fill="#FFE79A" opacity="0.5" stroke="none"/>
        <circle cx="40" cy="36" r="15" fill="#F5B700" stroke="none"/>
        <path clip-path="url(#bulb-clip)" d="M55 29 Q51 50 29 52 L58 58 Z" fill="#CC9600" stroke="none"/>
        <circle cx="40" cy="36" r="15" fill="none" stroke-width="5"/>
        <path d="M32 34 Q33 28 39 27" fill="none" stroke="#FFF4D6" stroke-width="3.5"/>
      </g>
    </g>
    <g id="backpack">
      <rect x="30" y="184" width="44" height="66" rx="15" fill="#A7B0C8"/>
    </g>
    <g id="torso">
      <path d="M38 250 V230 Q38 194 78 190 H178 Q218 194 218 230 V250 Z" fill="#E2403A"/>
      <g clip-path="url(#bust-clip)" stroke="none">
        <path id="torso-shade" d="M200 190 H224 V256 H176 Q204 230 200 190 Z" fill="#B52D28"/>
      </g>
      <path d="M38 250 V230 Q38 194 78 190 H178 Q218 194 218 230 V250 Z" fill="none"/>
      <g id="emblem">
        <circle cx="96" cy="228" r="11" fill="#F5B700" stroke-width="4"/>
        <circle cx="96" cy="228" r="4.5" fill="#FFF4D6" stroke="none"/>
      </g>
      <path id="torso-highlight" d="M50 240 V228 Q50 212 62 206" fill="none" stroke="#F28480" stroke-width="5"/>
    </g>
    <ellipse id="collar" cx="128" cy="194" rx="48" ry="12" fill="#A7B0C8" stroke-width="6"/>
    <g id="helmet" transform="translate(128 126) scale(1.36) translate(-128 -94)" stroke-width="5.15">
      <g stroke-width="2.94">
        <circle id="glass" cx="128" cy="94" r="50" fill="#CFE9FF" fill-opacity="0.6" stroke="none"/>
        <g id="head">
          <circle id="face" cx="128" cy="99" r="29" fill="#6E4630"/>
          <path id="face-shade" clip-path="url(#face-clip-f)" d="M156 92 Q152 122 120 128 L160 130 Z" fill="#553424" stroke="none"/>
          <path id="beard" d="M100 91 Q98 129 128 129 Q158 129 156 91 L151 92 Q151 109 140 111 Q134 107 128 109.5 Q122 107 116 111 Q105 109 105 92 Z" fill="#B9B4C4"/>
          <path id="hair" d="M100 93 Q99 70 128 70 Q157 70 156 93 Q152 83 145 84 Q138 79 131 81 Q124 78 117 81 Q108 80 100 93 Z" fill="#B9B4C4"/>
          <g id="face-features" stroke="none">
            <ellipse cx="117" cy="97" rx="4.6" ry="6" fill="#1E1A24"/>
            <ellipse cx="139" cy="97" rx="4.6" ry="6" fill="#1E1A24"/>
            <circle cx="118.6" cy="94.3" r="1.9" fill="#FFFFFF"/>
            <circle cx="140.6" cy="94.3" r="1.9" fill="#FFFFFF"/>
            <ellipse cx="107" cy="105" rx="5" ry="3.4" fill="#F48A9A" opacity="0.4"/>
            <ellipse cx="149" cy="105" rx="5" ry="3.4" fill="#F48A9A" opacity="0.4"/>
          </g>
          <path id="mouth" d="M116 108 H140 Q138 121 128 121 Q118 121 116 108 Z" fill="#FFFFFF" stroke-width="2.57"/>
          <path d="M121 117 Q128 113 135 117 Q132 120.5 128 120.5 Q124 120.5 121 117 Z" fill="#F27C8C" stroke="none"/>
        </g>
        <g id="visor-rim">
          <path d="M85 121 Q128 152 171 121" fill="none" stroke-width="11.76"/>
          <path d="M85 121 Q128 152 171 121" fill="none" stroke="#F5B700" stroke-width="6.62"/>
        </g>
        <g id="helmet-highlight" stroke="#FFFFFF" fill="none">
          <path d="M90 70 Q100 54 118 49" stroke-width="5.15" opacity="0.9"/>
          <circle cx="85" cy="84" r="1.5" stroke-width="3.68" opacity="0.9"/>
        </g>
        <circle id="helmet-outline" cx="128" cy="94" r="50" fill="none"/>
      </g>
    </g>
  </g>
</svg>
