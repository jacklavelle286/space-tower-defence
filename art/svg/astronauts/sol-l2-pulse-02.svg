<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 384" width="256" height="384">
  <!-- Sol (Beacon Commander) L2 (taller antenna with cross-bar, bigger bulb, gold star patch) pulse, frame 02: 02 beacon brightening, hand raised, knees soften.
