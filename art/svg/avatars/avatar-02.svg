      <g id="motif-star" transform="translate(128 46) rotate(-8)">
        <path d="M0 -34 L9.4 -12.9 L32.3 -10.5 L15.2 4.9 L20 27.5 L0 16 L-20 27.5 L-15.2 4.9 L-32.3 -10.5 L-9.4 -12.9 Z" fill="#FFD23F" stroke-width="6"/>
        <path d="M-9 -10 L-3 -22" fill="none" stroke="#FFEA99" stroke-width="5"/>
        <path d="M18 10 L7 10" fill="none" stroke="#E0AE1F" stroke-width="4" opacity="0.9"/>
      </g>
    </g>
    <g id="rim" fill="none">
      <circle cx="128" cy="128" r="117" stroke-width="10"/>
      <circle cx="128" cy="128" r="117" stroke="#FFD86B" stroke-width="4.5"/>
