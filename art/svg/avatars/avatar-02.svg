<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Profile avatar 02 (star). Still, 1 frame. Anchor centre (128,128).
       Round night-blue disc with tiny stars and a thin gold rim; transparent outside the circle.
       Head-and-shoulders character in a round glass helmet, facing the viewer. Light from the top-left. See art/STYLE.md. -->
  <defs>
    <clipPath id="disc-clip"><circle cx="128" cy="128" r="116"/></clipPath>
    <clipPath id="suit-clip"><path d="M24 268 Q26 208 82 192 Q104 186 128 186 Q152 186 174 192 Q230 208 232 268 Z"/></clipPath>
    <clipPath id="face-clip"><circle cx="128" cy="124" r="36"/></clipPath>
  </defs>
  <g id="avatar-02" stroke="#2A1E3D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <circle id="disc" cx="128" cy="128" r="116" fill="#23295E" stroke="none"/>
    <g id="portrait" clip-path="url(#disc-clip)">
      <g id="sky-stars" stroke="none" fill="#FFF4D6">
        <path d="M0 -9 Q2.5 -2.5 9 0 Q2.5 2.5 0 9 Q-2.5 2.5 -9 0 Q-2.5 -2.5 0 -9 Z" transform="translate(58 62)"/>
        <path d="M0 -7 Q2 -2 7 0 Q2 2 0 7 Q-2 2 -7 0 Q-2 -2 0 -7 Z" transform="translate(202 50)" fill="#9FF3FF"/>
        <path d="M0 -6 Q1.7 -1.7 6 0 Q1.7 1.7 0 6 Q-1.7 1.7 -6 0 Q-1.7 -1.7 0 -6 Z" transform="translate(40 150)"/>
        <path d="M0 -5 Q1.4 -1.4 5 0 Q1.4 1.4 0 5 Q-1.4 1.4 -5 0 Q-1.4 -1.4 0 -5 Z" transform="translate(220 140)" fill="#9FF3FF"/>
        <circle cx="96" cy="30" r="2.5"/><circle cx="170" cy="28" r="2"/>
        <circle cx="30" cy="104" r="2"/><circle cx="226" cy="100" r="2.5"/><circle cx="48" cy="196" r="2"/>
      </g>
      <g id="body">
        <g id="torso">
          <path d="M24 268 Q26 208 82 192 Q104 186 128 186 Q152 186 174 192 Q230 208 232 268 Z" fill="#F4F1EA"/>
          <path id="torso-shade" clip-path="url(#suit-clip)" d="M190 190 Q206 226 196 268 H240 V190 Z" fill="#2A1E3D" opacity="0.13" stroke="none"/>
          <path d="M24 268 Q26 208 82 192 Q104 186 128 186 Q152 186 174 192 Q230 208 232 268 Z" fill="none"/>
          <path id="torso-highlight" d="M52 236 Q56 214 76 206" fill="none" stroke="#FFFFFF" stroke-width="5"/>
          <path d="M84 196 Q80 222 84 260 M172 196 Q176 222 172 260" fill="none" stroke="#D8D2C4" stroke-width="4"/>
        </g>
        <ellipse id="collar" cx="128" cy="180" rx="46" ry="12" fill="#A7B0C8" stroke-width="6"/>
      </g>
      <g id="helmet">
        <circle id="glass" cx="128" cy="116" r="62" fill="#CFE9FF" fill-opacity="0.6" stroke="none"/>
        <g id="head" stroke-width="4">
          <circle id="face" cx="128" cy="124" r="36" fill="#FCE0CF"/>
          <path id="face-shade" clip-path="url(#face-clip)" d="M161 112 Q158 152 118 160 L170 166 Z" fill="#F2C3AA" stroke="none"/>
          <circle cx="128" cy="124" r="36" fill="none"/>
          <path id="fringe" d="M92 112 Q92 86 128 86 Q164 86 164 112 Q128 104 92 112 Z" fill="#6B4A35"/>
          <g id="face-features" stroke="none">
