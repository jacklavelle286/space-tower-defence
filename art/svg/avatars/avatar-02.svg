            <ellipse cx="141" cy="127" rx="5.6" ry="7.3" fill="#2A1E3D"/>
            <circle cx="117" cy="123.6" r="2.3" fill="#FFFFFF"/>
            <circle cx="143" cy="123.6" r="2.3" fill="#FFFFFF"/>
            <ellipse cx="104" cy="139" rx="6.5" ry="4.2" fill="#F48A9A" opacity="0.75"/>
            <ellipse cx="152" cy="139" rx="6.5" ry="4.2" fill="#F48A9A" opacity="0.75"/>
          </g>
          <path id="mouth" d="M118 141 Q128 150 138 141" fill="none" stroke-width="3.8"/>
        </g>
        <g id="visor-rim">
          <path d="M73 144 Q128 190 183 144" fill="none" stroke-width="20"/>
          <path d="M73 144 Q128 190 183 144" fill="none" stroke="#E05FD0" stroke-width="11"/>
        </g>
        <g id="helmet-highlight" stroke="#FFFFFF" fill="none" opacity="0.9">
