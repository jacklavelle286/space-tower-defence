<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Profile avatar 05 (ringed planet). Still, 1 frame. Anchor centre (128,128).
       Round night-blue disc with tiny stars and a thin gold rim; transparent outside the circle.
       Head-and-shoulders character in a round glass helmet, facing the viewer. Light from the top-left. See art/STYLE.md. -->
