            <circle cx="116.5" cy="117" r="3" fill="#FFFFFF" stroke="none"/>
            <circle cx="144.5" cy="117" r="3" fill="#FFFFFF" stroke="none"/>
            <rect x="112" y="136" width="32" height="10" rx="5" fill="#2A1E3D" stroke="none"/>
            <rect x="117" y="139" width="22" height="4" rx="2" fill="#FFE79A" stroke="none"/>
            <circle cx="102" cy="138" r="4" fill="#F48A9A" opacity="0.8" stroke="none"/>
            <circle cx="154" cy="138" r="4" fill="#F48A9A" opacity="0.8" stroke="none"/>
