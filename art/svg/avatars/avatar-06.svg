<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Profile avatar 06 (robot). Still, 1 frame. Anchor centre (128,128).
       Round night-blue disc with tiny stars and a thin gold rim; transparent outside the circle.
       Head-and-shoulders character in a round glass helmet, facing the viewer. Light from the top-left. See art/STYLE.md. -->
  <defs>
    <clipPath id="disc-clip"><circle cx="128" cy="128" r="116"/></clipPath>
    <clipPath id="suit-clip"><path d="M24 268 Q26 208 82 192 Q104 186 128 186 Q152 186 174 192 Q230 208 232 268 Z"/></clipPath>
    <clipPath id="face-clip"><circle cx="128" cy="124" r="36"/></clipPath>
  </defs>
  <g id="avatar-06" stroke="#2A1E3D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
