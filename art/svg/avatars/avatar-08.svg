    <clipPath id="suit-clip"><path d="M24 268 Q26 208 82 192 Q104 186 128 186 Q152 186 174 192 Q230 208 232 268 Z"/></clipPath>
    <clipPath id="face-clip"><circle cx="128" cy="124" r="36"/></clipPath>
  </defs>
