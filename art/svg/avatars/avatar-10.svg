<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Profile avatar 10 (sun). Still, 1 frame. Anchor centre (128,128).
       Round night-blue disc with tiny stars and a thin gold rim; transparent outside the circle.
