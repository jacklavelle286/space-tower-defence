<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- badge-all-rounder-outline: All-Rounder: counting beads, an ear with sound waves and a pencil. outline (not yet earned: 15% white fill, thin grey #A7B0C8 lines). Single frame. Anchor centre (128,128).
       Medal: gold rim, cream ring, night-blue disc, ribbon tab at the bottom. Light from the top-left. See art/STYLE.md. -->

<g id="badge-all-rounder-outline" stroke-linejoin="round" stroke-linecap="round">
  <g id="silhouette" fill="#FFFFFF" opacity="0.15" stroke="none">
    <path d="M98 176 L130 186 L114 245 L99 233 L80 240 Z"/><path d="M158 176 L126 186 L142 245 L157 233 L176 240 Z"/>
    <circle cx="128" cy="114" r="96"/>
  </g>
  <mask id="badge-all-rounder-outline-lines" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
    <rect x="0" y="0" width="256" height="256" fill="#000"/>
    <g id="outline-lines" fill="#000" stroke="#FFF" stroke-width="5">
      <path d="M158 176 L126 186 L142 245 L157 233 L176 240 Z"/><path d="M98 176 L130 186 L114 245 L99 233 L80 240 Z"/>
      <circle cx="128" cy="114" r="96"/>
      <circle cx="128" cy="114" r="70" fill="none" stroke-width="3"/>
      <g id="motif" transform="translate(128 114)" stroke-width="4">
        <g id="beads" transform="translate(0 -34)">
          <path d="M-44 0 H44" fill="none" stroke="#FFF" stroke-width="5" />
          <path d="M-44 0 H44" fill="none" stroke="#000" stroke-width="1" />
          <circle cx="-28" cy="0" r="7.5" fill="#000" stroke="#FFF" stroke-width="3.5" />
          <circle cx="-14" cy="0" r="7.5" fill="#000" stroke="#FFF" stroke-width="3.5" />
          <circle cx="0" cy="0" r="7.5" fill="#000" stroke="#FFF" stroke-width="3.5" />
          <circle cx="14" cy="0" r="7.5" fill="#000" stroke="#FFF" stroke-width="3.5" />
          <circle cx="28" cy="0" r="7.5" fill="#000" stroke="#FFF" stroke-width="3.5" />
        </g>
        <g id="ear" transform="translate(-14 16) scale(-1 1)">
          <path d="M2 -22 Q22 -22 22 -2 Q22 10 12 16 Q6 20 5 27 Q3 36 -6 35 Q-14 34 -14 24 Q-12 14 -14 6 Q-18 -22 2 -22 Z" fill="#000" stroke="#FFF" stroke-width="4" />
          <path d="M12 -2 Q12 -12 3 -12 Q-5 -12 -5 -2 Q-4 6 4 8" fill="none" stroke="#FFF" stroke-width="3.5" />
        </g>
        <g id="sound-waves">
          <path d="M-39.7 14.4 A10 10 0 0 1 -39.7 1.6" fill="none" stroke="#FFF" stroke-width="4" />
          <path d="M-48.4 19.5 A20 20 0 0 1 -48.4 -3.5" fill="none" stroke="#FFF" stroke-width="4" />
        </g>
        <g id="pencil" transform="translate(30 22) rotate(-55)">
          <path d="M18 -7 L32 0 L18 7 Z" fill="#000" stroke="#FFF" stroke-width="3.5" />
          <path d="M27 -2.5 L32 0 L27 2.5 Z" fill="#FFF" stroke="none" />
          <rect x="-26" y="-7" width="44" height="14" rx="2" fill="#000" stroke="#FFF" stroke-width="3.5" />
          <rect x="-26" y="-7" width="7" height="14" rx="1.5" fill="#000" stroke="#FFF" stroke-width="3.5" />
          <path d="M-26 -7 H-31 Q-36 -7 -36 0 Q-36 7 -31 7 H-26 Z" fill="#000" stroke="#FFF" stroke-width="3.5" />
        </g>
      </g>
    </g>
  </mask>
  <rect x="0" y="0" width="256" height="256" fill="#A7B0C8" mask="url(#badge-all-rounder-outline-lines)"/>
