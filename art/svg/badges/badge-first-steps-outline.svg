        </g>
        <circle cx="-40" cy="22" r="4" fill="#FFF" stroke="none" />
        <circle cx="38" cy="-18" r="3.5" fill="#FFF" stroke="none" />
        <circle cx="40" cy="28" r="3" fill="#FFF" stroke="none" />
