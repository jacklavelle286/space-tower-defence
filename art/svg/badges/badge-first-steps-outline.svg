        <g id="boot-print" transform="translate(4 4) rotate(-22) scale(0.92)">
          <path d="M-14 -14 Q-16 -38 0 -38 Q16 -38 15 -14 Q14 2 10 8 Q13 20 12 30 Q10 41 0 41 Q-10 41 -11 30 Q-12 20 -9 8 Q-14 2 -14 -14 Z" fill="#000" stroke="#FFF" stroke-width="4" />
