<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- badge-keep-trying-outline: Keep Trying: a little rocket launching up again after a big curly wobble trail. outline (not yet earned: 15% white fill, thin grey #A7B0C8 lines). Single frame. Anchor centre (128,128).
