<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- badge-safe-and-sound-outline: Safe and Sound: the white domed colony under a cyan hexagon shield dome. outline (not yet earned: 15% white fill, thin grey #A7B0C8 lines). Single frame. Anchor centre (128,128).
       Medal: gold rim, cream ring, night-blue disc, ribbon tab at the bottom. Light from the top-left. See art/STYLE.md. -->

<g id="badge-safe-and-sound-outline" stroke-linejoin="round" stroke-linecap="round">
  <g id="silhouette" fill="#FFFFFF" opacity="0.15" stroke="none">
    <path d="M98 176 L130 186 L114 245 L99 233 L80 240 Z"/><path d="M158 176 L126 186 L142 245 L157 233 L176 240 Z"/>
    <circle cx="128" cy="114" r="96"/>
  </g>
  <mask id="badge-safe-and-sound-outline-lines" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
    <rect x="0" y="0" width="256" height="256" fill="#000"/>
    <g id="outline-lines" fill="#000" stroke="#FFF" stroke-width="5">
      <path d="M158 176 L126 186 L142 245 L157 233 L176 240 Z"/><path d="M98 176 L130 186 L114 245 L99 233 L80 240 Z"/>
      <circle cx="128" cy="114" r="96"/>
      <circle cx="128" cy="114" r="70" fill="none" stroke-width="3"/>
      <g id="motif" transform="translate(128 114)" stroke-width="4">
        <g id="shield" transform="translate(0 -2) scale(0.95)">
          <clipPath id="badge-safe-and-sound-outline-shield"><path d="M-52 38 Q-52 -50 0 -52 Q52 -50 52 38 Q0 50 -52 38 Z" /></clipPath>
          <g id="colony" transform="translate(0 8) scale(0.85)">
            <rect x="-42" y="26" width="84" height="20" rx="8" fill="#000" stroke="#FFF" stroke-width="4" />
            <path d="M-34 30 Q-34 -12 0 -13 Q34 -12 34 30 Z" fill="#000" stroke="#FFF" stroke-width="4" />
            <path d="M-8 30 V16 Q-8 7 0 7 Q8 7 8 16 V30 Z" fill="#000" stroke="#FFF" stroke-width="3.5" />
            <circle cx="19" cy="11" r="5.5" fill="#000" stroke="#FFF" stroke-width="3.5" />
            <path d="M0 -13 V-24" fill="none" stroke="#FFF" stroke-width="4" />
            <circle cx="0" cy="-28" r="5" fill="#000" stroke="#FFF" stroke-width="3.5" />
          </g>
          <path d="M-52 38 Q-52 -50 0 -52 Q52 -50 52 38 Q0 50 -52 38 Z" fill="none" stroke="#FFF" stroke-width="4" />
        </g>
      </g>
    </g>
  </mask>
  <rect x="0" y="0" width="256" height="256" fill="#A7B0C8" mask="url(#badge-safe-and-sound-outline-lines)"/>
</g>
