<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- badge-top-team-outline: Top Team: one astronaut helmet with three stacked upward chevrons. outline (not yet earned: 15% white fill, thin grey #A7B0C8 lines). Single frame. Anchor centre (128,128).
       Medal: gold rim, cream ring, night-blue disc, ribbon tab at the bottom. Light from the top-left. See art/STYLE.md. -->

<g id="badge-top-team-outline" stroke-linejoin="round" stroke-linecap="round">
  <g id="silhouette" fill="#FFFFFF" opacity="0.15" stroke="none">
    <path d="M98 176 L130 186 L114 245 L99 233 L80 240 Z"/><path d="M158 176 L126 186 L142 245 L157 233 L176 240 Z"/>
    <circle cx="128" cy="114" r="96"/>
  </g>
  <mask id="badge-top-team-outline-lines" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
    <rect x="0" y="0" width="256" height="256" fill="#000"/>
    <g id="outline-lines" fill="#000" stroke="#FFF" stroke-width="5">
      <path d="M158 176 L126 186 L142 245 L157 233 L176 240 Z"/><path d="M98 176 L130 186 L114 245 L99 233 L80 240 Z"/>
      <circle cx="128" cy="114" r="96"/>
      <circle cx="128" cy="114" r="70" fill="none" stroke-width="3"/>
      <g id="motif" transform="translate(128 114)" stroke-width="4">
        <path d="M-22 -18 L0 -30 L22 -18" fill="none" stroke="#FFF" stroke-width="13" />
        <path d="M-22 -18 L0 -30 L22 -18" fill="none" stroke="#000" stroke-width="5.8" />
        <path d="M-19 -30 L0 -42 L19 -30" fill="none" stroke="#FFF" stroke-width="13" />
        <path d="M-19 -30 L0 -42 L19 -30" fill="none" stroke="#000" stroke-width="5.8" />
        <path d="M-16 -42 L0 -54 L16 -42" fill="none" stroke="#FFF" stroke-width="13" />
        <path d="M-16 -42 L0 -54 L16 -42" fill="none" stroke="#000" stroke-width="5.8" />
        <ellipse cx="0" cy="50" rx="24" ry="7" fill="#000" stroke="#FFF" stroke-width="4" />
        <g id="helmet" transform="translate(0 18) scale(1.9)">
          <rect x="-20" y="-5" width="6" height="10" rx="3" fill="#000" stroke="#FFF" stroke-width="2.2" />
          <rect x="14" y="-5" width="6" height="10" rx="3" fill="#000" stroke="#FFF" stroke-width="2.2" />
          <circle cx="0" cy="0" r="17" fill="#000" stroke="#FFF" stroke-width="2.5" />
          <ellipse cx="1" cy="1" rx="12.5" ry="8.5" fill="#000" stroke="#FFF" stroke-width="2.2" />
        </g>
      </g>
    </g>
  </mask>
  <rect x="0" y="0" width="256" height="256" fill="#A7B0C8" mask="url(#badge-top-team-outline-lines)"/>
</g>
</svg>
