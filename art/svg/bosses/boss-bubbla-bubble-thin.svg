    <circle cx="170 " cy="170" r="9" fill="#FFFFFF" opacity="0.6"/>
    <path id="shine" d="M584 534 A262 262 0 0 1 534 584" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.4"/>
    <circle id="outline" cx="384" cy="384" r="352" fill="none" stroke="#2A1E3D" stroke-width="6" opacity="0.5"/>
