<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Juno comet projectile, frame 01/04: golden ball flying right, tail stars drift left (one third of a slot per loop). Anchor centre (64,64).
       See art/STYLE.md. -->
