    <defs><clipPath id="ball-clip"><circle cx="84" cy="64" r="22"/></clipPath></defs>
    <g id="tail" stroke="none"><path d="M84 43 Q48 50 16 61 Q11 64 16 67 Q48 78 84 85 Z" fill="#FFF4D6" opacity="0.7"/><path d="M84 53 Q54 57 30 63 Q27 64 30 65 Q54 71 84 75 Z" fill="#FFE79A" opacity="0.9"/></g>
    <g id="stars">
    <path d="M0 -10 L2.9 -4 L9.5 -3.1 L4.8 1.5 L5.9 8.1 L0 5 L-5.9 8.1 L-4.8 1.5 L-9.5 -3.1 L-2.9 -4 Z" fill="#FFD23F" stroke="#2A1E3D" stroke-width="2.5" stroke-linejoin="round" transform="translate(62 57) rotate(-0)"/>
    <path d="M0 -8.2 L2.4 -3.3 L7.8 -2.5 L3.9 1.3 L4.8 6.6 L0 4.1 L-4.8 6.6 L-3.9 1.3 L-7.8 -2.5 L-2.4 -3.3 Z" fill="#FFF4D6" stroke="#2A1E3D" stroke-width="2.5" stroke-linejoin="round" transform="translate(46.7 71) rotate(-20)"/>
    <path d="M0 -6.3 L1.9 -2.6 L6 -2 L3 1 L3.7 5.1 L0 3.2 L-3.7 5.1 L-3 1 L-6 -2 L-1.9 -2.6 Z" fill="#FFD23F" stroke="#2A1E3D" stroke-width="2.5" stroke-linejoin="round" transform="translate(31.3 57) rotate(-40)"/>
    </g>
    <g id="ball" transform="translate(84 64) scale(1 1) translate(-84 -64)"><circle cx="84" cy="64" r="22" fill="#FFC94A" stroke="none"/><g clip-path="url(#ball-clip)" stroke="none"><circle cx="93" cy="73" r="24" fill="none" stroke="#E0AE1F" stroke-width="10"/></g><path d="M70 63 Q71 52 81 49" fill="none" stroke="#FFFFFF" stroke-width="4.5"/><circle cx="70" cy="70" r="2.2" fill="#FFFFFF" stroke="none"/><circle cx="84" cy="64" r="22" fill="none" stroke="#2A1E3D" stroke-width="5"/></g>
    <path d="M0 -6 Q1.7 -1.7 6 0 Q1.7 1.7 0 6 Q-1.7 1.7 -6 0 Q-1.7 -1.7 0 -6 Z" fill="#FFF4D6" stroke="#2A1E3D" stroke-width="2" stroke-linejoin="round" transform="translate(102 40) rotate(0)"/>
  </g>
</svg>
