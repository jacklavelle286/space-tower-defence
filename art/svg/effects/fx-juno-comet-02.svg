    <g id="stars">
    <path d="M0 -9.5 L2.8 -3.9 L9.1 -2.9 L4.5 1.5 L5.6 7.7 L0 4.8 L-5.6 7.7 L-4.5 1.5 L-9.1 -2.9 L-2.8 -3.9 Z" fill="#FFD23F" stroke="#2A1E3D" stroke-width="2.5" stroke-linejoin="round" transform="translate(58.2 57) rotate(-5)"/>
    <path d="M0 -7.7 L2.3 -3.1 L7.3 -2.4 L3.7 1.2 L4.5 6.2 L0 3.9 L-4.5 6.2 L-3.7 1.2 L-7.3 -2.4 L-2.3 -3.1 Z" fill="#FFF4D6" stroke="#2A1E3D" stroke-width="2.5" stroke-linejoin="round" transform="translate(42.8 71) rotate(-25)"/>
    <path d="M0 -5.9 L1.7 -2.4 L5.6 -1.8 L2.8 0.9 L3.5 4.8 L0 2.9 L-3.5 4.8 L-2.8 0.9 L-5.6 -1.8 L-1.7 -2.4 Z" fill="#FFD23F" stroke="#2A1E3D" stroke-width="2.5" stroke-linejoin="round" transform="translate(27.5 57) rotate(-45)"/>
    </g>
    <g id="ball" transform="translate(84 64) scale(1.03 0.97) translate(-84 -64)"><circle cx="84" cy="64" r="22" fill="#FFC94A" stroke="none"/><g clip-path="url(#ball-clip)" stroke="none"><circle cx="93" cy="73" r="24" fill="none" stroke="#E0AE1F" stroke-width="10"/></g><path d="M70 63 Q71 52 81 49" fill="none" stroke="#FFFFFF" stroke-width="4.5"/><circle cx="70" cy="70" r="2.2" fill="#FFFFFF" stroke="none"/><circle cx="84" cy="64" r="22" fill="none" stroke="#2A1E3D" stroke-width="5"/></g>
