    <defs><clipPath id="ball-clip"><circle cx="84" cy="64" r="22"/></clipPath></defs>
    <g id="tail" stroke="none"><path d="M84 43 Q48 50 16 61 Q11 64 16 67 Q48 78 84 85 Z" fill="#FFF4D6" opacity="0.7"/><path d="M84 53 Q54 57 30 63 Q27 64 30 65 Q54 71 84 75 Z" fill="#FFE79A" opacity="0.9"/></g>
    <g id="stars">
    <path d="M0 -9.1 L2.7 -3.7 L8.6 -2.8 L4.3 1.4 L5.3 7.3 L0 4.5 L-5.3 7.3 L-4.3 1.4 L-8.6 -2.8 L-2.7 -3.7 Z" fill="#FFD23F" stroke="#2A1E3D" stroke-width="2.5" stroke-linejoin="round" transform="translate(54.3 57) rotate(-10)"/>
    <path d="M0 -7.2 L2.1 -2.9 L6.9 -2.2 L3.4 1.1 L4.3 5.9 L0 3.6 L-4.3 5.9 L-3.4 1.1 L-6.9 -2.2 L-2.1 -2.9 Z" fill="#FFF4D6" stroke="#2A1E3D" stroke-width="2.5" stroke-linejoin="round" transform="translate(39 71) rotate(-30)"/>
    <path d="M0 -5.4 L1.6 -2.2 L5.2 -1.7 L2.6 0.8 L3.2 4.4 L0 2.7 L-3.2 4.4 L-2.6 0.8 L-5.2 -1.7 L-1.6 -2.2 Z" fill="#FFD23F" stroke="#2A1E3D" stroke-width="2.5" stroke-linejoin="round" transform="translate(23.7 57) rotate(-50)"/>
    </g>
    <g id="ball" transform="translate(84 64) scale(1 1) translate(-84 -64)"><circle cx="84" cy="64" r="22" fill="#FFC94A" stroke="none"/><g clip-path="url(#ball-clip)" stroke="none"><circle cx="93" cy="73" r="24" fill="none" stroke="#E0AE1F" stroke-width="10"/></g><path d="M70 63 Q71 52 81 49" fill="none" stroke="#FFFFFF" stroke-width="4.5"/><circle cx="70" cy="70" r="2.2" fill="#FFFFFF" stroke="none"/><circle cx="84" cy="64" r="22" fill="none" stroke="#2A1E3D" stroke-width="5"/></g>
    <path d="M0 -6 Q1.7 -1.7 6 0 Q1.7 1.7 0 6 Q-1.7 1.7 -6 0 Q-1.7 -1.7 0 -6 Z" fill="#FFF4D6" stroke="#2A1E3D" stroke-width="2" stroke-linejoin="round" transform="translate(100 42) rotate(0)"/>
  </g>
