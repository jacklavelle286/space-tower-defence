    <circle cx="124" cy="112" r="9" fill="#A7B0C8" stroke-width="5"/>
    <circle cx="161" cy="46" r="13" fill="#FFD86B" stroke-width="6"/>
    <path d="M165 50 A7 7 0 0 1 156 54" fill="none" stroke="#E0AE1F" stroke-width="4"/>
    <circle cx="156.5" cy="41.5" r="3.5" fill="#FFFFFF" stroke="none"/>
  </g>
</g>
</svg>
