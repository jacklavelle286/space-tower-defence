<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- deco-crater-2: a medium shallow moon crater lying flat on the ground (4:3 ellipse): lit lavender rim, dark bowl with the shade on the top-left inner wall. Single frame. Anchor centre (128,128).
       Light from the top-left. See art/STYLE.md. -->

<g id="crater" stroke="#2A1E3D" stroke-linejoin="round" stroke-linecap="round">
  <clipPath id="rim-clip"><ellipse cx="128" cy="128" rx="80" ry="60"/></clipPath>
  <clipPath id="bowl-clip"><ellipse cx="132.8" cy="132.8" rx="57.6" ry="43.2"/></clipPath>
  <g id="rim">
    <ellipse cx="128" cy="128" rx="80" ry="60" fill="#9C8FD6" stroke="none"/>
    <ellipse clip-path="url(#rim-clip)" cx="122.4" cy="122.4" rx="80" ry="60" fill="#B3A8E3" stroke="none"/>
    <path id="rim-highlight" d="M59.2 108.8 A73.6 55.2 0 0 1 104 76.4" fill="none" stroke="#C9C0F0" stroke-width="5"/>
  </g>
  <g id="bowl">
    <ellipse cx="132.8" cy="132.8" rx="57.6" ry="43.2" fill="#4A3F7A" stroke="none"/>
    <ellipse clip-path="url(#bowl-clip)" cx="140.5" cy="140.5" rx="57.6" ry="43.2" fill="#6B5CA5" stroke="none"/>
    <ellipse cx="114" cy="138" rx="9" ry="6.8" fill="#9C8FD6" stroke-width="4"/>
    <path d="M109.5 137.1 Q110.4 133.5 114 133.1" fill="none" stroke="#C9C0F0" stroke-width="3"/>
    <ellipse cx="132.8" cy="132.8" rx="57.6" ry="43.2" fill="none" stroke-width="5"/>
  </g>
  <ellipse id="rim-outline" cx="128" cy="128" rx="80" ry="60" fill="none" stroke-width="8"/>
</g>
</svg>
