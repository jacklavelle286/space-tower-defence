<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- deco-crater-3: a large shallow moon crater lying flat on the ground (4:3 ellipse): lit lavender rim, dark bowl with the shade on the top-left inner wall. Single frame. Anchor centre (128,128).
       Light from the top-left. See art/STYLE.md. -->

<g id="crater" stroke="#2A1E3D" stroke-linejoin="round" stroke-linecap="round">
  <clipPath id="rim-clip"><ellipse cx="128" cy="128" rx="104" ry="78"/></clipPath>
  <clipPath id="bowl-clip"><ellipse cx="134.2" cy="134.2" rx="74.9" ry="56.2"/></clipPath>
  <g id="rim">
    <ellipse cx="128" cy="128" rx="104" ry="78" fill="#9C8FD6" stroke="none"/>
    <ellipse clip-path="url(#rim-clip)" cx="120.7" cy="120.7" rx="104" ry="78" fill="#B3A8E3" stroke="none"/>
    <path id="rim-highlight" d="M38.6 103 A95.7 71.8 0 0 1 96.8 60.9" fill="none" stroke="#C9C0F0" stroke-width="5"/>
  </g>
  <g id="bowl">
    <ellipse cx="134.2" cy="134.2" rx="74.9" ry="56.2" fill="#4A3F7A" stroke="none"/>
    <ellipse clip-path="url(#bowl-clip)" cx="144.2" cy="144.2" rx="74.9" ry="56.2" fill="#6B5CA5" stroke="none"/>
    <ellipse cx="102" cy="142" rx="11" ry="8.2" fill="#9C8FD6" stroke-width="4"/>
    <path d="M96.5 140.9 Q97.6 136.5 102 135.9" fill="none" stroke="#C9C0F0" stroke-width="3"/>
    <ellipse cx="142" cy="154" rx="7" ry="5.2" fill="#9C8FD6" stroke-width="4"/>
    <path d="M138.5 153.3 Q139.2 150.5 142 150.2" fill="none" stroke="#C9C0F0" stroke-width="3"/>
    <ellipse cx="134.2" cy="134.2" rx="74.9" ry="56.2" fill="none" stroke-width="5"/>
  </g>
  <ellipse id="rim-outline" cx="128" cy="128" rx="104" ry="78" fill="none" stroke-width="8"/>
</g>
</svg>
