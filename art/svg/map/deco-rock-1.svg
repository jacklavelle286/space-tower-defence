       Light from the top-left. See art/STYLE.md. -->

<g id="rock" stroke="#2A1E3D" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
  <clipPath id="boulder-clip"><path d="M40 236 Q30 190 58 150 Q84 92 140 88 Q198 86 218 140 Q238 192 224 236 Q220 250 204 250 H56 Q42 250 40 236 Z"/></clipPath>
  <g id="boulder">
