    <path id="boulder-outline" d="M40 236 Q30 190 58 150 Q84 92 140 88 Q198 86 218 140 Q238 192 224 236 Q220 250 204 250 H56 Q42 250 40 236 Z" fill="none"/>
  </g>
</g>
</svg>
