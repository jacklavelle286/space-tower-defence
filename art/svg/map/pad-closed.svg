<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- pad-closed: the same build pad, locked: rim lights off, dimmer grey-blue metal, the top closed by two shutter halves meeting in the middle, gold padlock (icon-lock) in the centre. Single frame. Anchor centre (128,128); standPoint (128,107.5).
       Light from the top-left. See art/STYLE.md. -->

<g id="pad-closed" stroke="#2A1E3D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
  <g id="pad">
    <path id="pad-side" d="M36 107.5 V127.5 A92 69 0 0 0 220 127.5 V107.5 Z" fill="#69728F"/>
    <path id="side-highlight" d="M46 139.5 Q54 153.5 70 163.5" fill="none" stroke="#8D97B5" stroke-width="4"/>
    <ellipse id="pad-top" cx="128" cy="107.5" rx="92" ry="69" fill="#8D97B5"/>
    <ellipse id="rim-lip" cx="131" cy="110.5" rx="66" ry="49.5" fill="#7A84A2" stroke-width="4"/>
    <ellipse id="stand-top" cx="128" cy="107.5" rx="66" ry="49.5" fill="#8D97B5" stroke="none"/>
    <path id="pad-highlight" d="M50 93.5 A78.2 58.7 0 0 1 109.6 46.8" fill="none" stroke="#A9B2CB" stroke-width="5"/>
    <g id="shutters">
      <clipPath id="shutter-clip"><ellipse cx="128" cy="107.5" rx="64" ry="48"/></clipPath>
      <ellipse cx="128" cy="107.5" rx="64" ry="48" fill="#7F89A6" stroke="none"/>
      <g clip-path="url(#shutter-clip)" stroke-width="3" opacity="0.35">
        <path d="M84 40 V180 M106 40 V180 M150 40 V180 M172 40 V180" fill="none"/>
      </g>
      <path clip-path="url(#shutter-clip)" d="M132 60 H200 V170 H132 Z M200 60 V170 H180 Q192 120 200 60 Z" fill="#2A1E3D" opacity="0.1" stroke="none"/>
      <path d="M72 99.5 Q78 71.5 104 65.5" fill="none" stroke="#A9B2CB" stroke-width="4"/>
      <path d="M138 65.5 Q158 63.5 168 69.5" fill="none" stroke="#A9B2CB" stroke-width="4"/>
      <path d="M128 59.5 V155.5" fill="none" stroke-width="5"/>
      <ellipse cx="128" cy="107.5" rx="64" ry="48" fill="none" stroke-width="4"/>
    </g>
    <g id="rim-lights">
      <circle cx="201" cy="130.2" r="5.5" fill="#6B7493" stroke-width="3"/>
      <circle cx="158.2" cy="162.3" r="5.5" fill="#6B7493" stroke-width="3"/>
      <circle cx="97.8" cy="162.3" r="5.5" fill="#6B7493" stroke-width="3"/>
      <circle cx="55" cy="130.2" r="5.5" fill="#6B7493" stroke-width="3"/>
      <circle cx="55" cy="84.8" r="5.5" fill="#6B7493" stroke-width="3"/>
      <circle cx="97.8" cy="52.7" r="5.5" fill="#6B7493" stroke-width="3"/>
      <circle cx="158.2" cy="52.7" r="5.5" fill="#6B7493" stroke-width="3"/>
      <circle cx="201" cy="84.8" r="5.5" fill="#6B7493" stroke-width="3"/>
    </g>
  </g>
  <g id="lock" transform="translate(128 107.5) scale(1.25) translate(-32 -33)" stroke-width="4">
    <g id="shackle" fill="none">
      <path d="M21 30 V21 Q21 10 32 10 Q43 10 43 21 V30" stroke="#2A1E3D" stroke-width="11"/>
      <path d="M21 30 V21 Q21 10 32 10 Q43 10 43 21 V30" stroke="#C9D0E2" stroke-width="4"/>
    </g>
    <clipPath id="lock-body-clip"><rect x="11" y="27" width="42" height="29" rx="9"/></clipPath>
    <rect id="lock-body" x="11" y="27" width="42" height="29" rx="9" fill="#F5B700" stroke="none"/>
    <path id="lock-shade" clip-path="url(#lock-body-clip)" d="M46 24 Q50 46 34 58 H58 V24 Z" fill="#D49A00" stroke="none"/>
    <path id="lock-highlight" d="M16 44 V37 Q16 32 21 31.5" fill="none" stroke="#FFE38A" stroke-width="3"/>
    <rect id="lock-outline" x="11" y="27" width="42" height="29" rx="9" fill="none"/>
    <path id="keyhole" d="M32 35.5 A4.6 4.6 0 0 1 34.3 44.1 L35 48.6 Q35 49.6 34 49.6 H30 Q29 49.6 29 48.6 L29.7 44.1 A4.6 4.6 0 0 1 32 35.5 Z" fill="#2A1E3D" stroke="none"/>
  </g></g>
</svg>
