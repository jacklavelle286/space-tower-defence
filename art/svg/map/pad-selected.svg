<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- pad-selected: the build pad with a thick sunshine-yellow outline around its whole silhouette plus a round green tick badge at the top-right (state shown by shape, not colour alone). Single frame. Anchor centre (128,128); standPoint (128,107.5).
