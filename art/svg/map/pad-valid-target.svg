    <ellipse id="pad-top" cx="128" cy="107.5" rx="92" ry="69" fill="#A7B0C8"/>
    <ellipse id="rim-lip" cx="131" cy="110.5" rx="66" ry="49.5" fill="#7F89A6" stroke-width="4"/>
    <ellipse id="stand-top" cx="128" cy="107.5" rx="66" ry="49.5" fill="#A7B0C8" stroke="none"/>
    <path id="pad-highlight" d="M50 93.5 A78.2 58.7 0 0 1 109.6 46.8" fill="none" stroke="#C9D0E2" stroke-width="5"/>
