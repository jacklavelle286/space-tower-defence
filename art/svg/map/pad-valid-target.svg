<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- pad-valid-target: the build pad inside a dashed cream-and-plum ring with a soft warm glow on the ground: 'you can place here'. Differs from hover by shape (dashed), the game pulses it. Single frame. Anchor centre (128,128); standPoint (128,107.5).
       Light from the top-left. See art/STYLE.md. -->

<g id="pad-valid-target" stroke="#2A1E3D" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
  <g id="glow" stroke="none">
    <ellipse cx="128" cy="120" rx="104" ry="78.0" fill="#FFE79A" opacity="0.3"/>
  </g>
  <g id="pad">
