      <circle cx="158.2" cy="162.3" r="12" fill="#FFE79A" opacity="0.75" stroke="none"/><circle cx="158.2" cy="162.3" r="6.5" fill="#FFF4D6" stroke-width="3"/>
      <circle cx="97.8" cy="162.3" r="12" fill="#FFE79A" opacity="0.75" stroke="none"/><circle cx="97.8" cy="162.3" r="6.5" fill="#FFF4D6" stroke-width="3"/>
      <circle cx="55" cy="130.2" r="12" fill="#FFE79A" opacity="0.75" stroke="none"/><circle cx="55" cy="130.2" r="6.5" fill="#FFF4D6" stroke-width="3"/>
      <circle cx="55" cy="84.8" r="12" fill="#FFE79A" opacity="0.75" stroke="none"/><circle cx="55" cy="84.8" r="6.5" fill="#FFF4D6" stroke-width="3"/>
      <circle cx="97.8" cy="52.7" r="12" fill="#FFE79A" opacity="0.75" stroke="none"/><circle cx="97.8" cy="52.7" r="6.5" fill="#FFF4D6" stroke-width="3"/>
      <circle cx="158.2" cy="52.7" r="12" fill="#FFE79A" opacity="0.75" stroke="none"/><circle cx="158.2" cy="52.7" r="6.5" fill="#FFF4D6" stroke-width="3"/>
      <circle cx="201" cy="84.8" r="12" fill="#FFE79A" opacity="0.75" stroke="none"/><circle cx="201" cy="84.8" r="6.5" fill="#FFF4D6" stroke-width="3"/>
