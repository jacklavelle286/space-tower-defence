<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- route-colony-end-up: route end cap for a route that ends heading up: the track enters on the bottom edge exactly like the straight tile and stops at a rounded metal doorstep with a plain glowing gate line. Drawn for LD11: shade bottom-right, highlight top-left, as every doorstep. Single frame. Anchor centre (96,96). -->
  <g id="route-colony-end">
    <g id="track" fill="none" stroke-linecap="butt">
      <path id="glow" d="M96 192 V64" stroke="#3FB8AF" stroke-width="164" opacity="0.3"/>
      <path id="outline" d="M96 192 V64" stroke="#2A1E3D" stroke-width="146"/>
      <path id="border" d="M96 192 V64" stroke="#3FB8AF" stroke-width="134"/>
      <path id="border-light" d="M96 192 V64" stroke="#7FD9D2" stroke-width="124"/>
      <path id="inner-line" d="M96 192 V64" stroke="#2A1E3D" stroke-width="112"/>
      <path id="dust" d="M96 192 V64" stroke="#E6DDF7" stroke-width="106"/>
    </g>
    <g id="specks" fill="#C9C0F0"><ellipse cx="66" cy="162" rx="6" ry="4.5"/></g>
    <g id="arrow" transform="translate(96 134)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-15 -24 L13 0 L-15 24" stroke="#B3A8E3" stroke-width="17" transform="rotate(270)"/>
      <path d="M-15 -24 L13 0 L-15 24" stroke="#FFFFFF" stroke-width="5" opacity="0.8" transform="translate(-3 -2) rotate(270)"/>
    </g>
    <g id="doorstep" stroke="#2A1E3D" stroke-width="6" stroke-linejoin="round">
      <rect x="14" y="8" width="164" height="86" rx="40" fill="#3FB8AF" opacity="0.3" stroke="none" transform="translate(0 4)"/>
      <rect x="22" y="12" width="148" height="78" rx="36" fill="#A7B0C8"/>
      <clipPath id="step-clip-up"><rect x="22" y="12" width="148" height="78" rx="36"/></clipPath>
      <path clip-path="url(#step-clip-up)" d="M40 94 H176 V20 Q150 80 40 78 Z" fill="#7F89A6" stroke="none"/>
      <rect x="22" y="12" width="148" height="78" rx="36" fill="none"/>
      <path d="M34 60 Q34 28 66 22" fill="none" stroke="#C9D0E2" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="gate-line" stroke-linecap="round">
      <path d="M52 51 H140" stroke="#FFE79A" stroke-width="30" opacity="0.55"/>
      <path d="M52 51 H140" stroke="#2A1E3D" stroke-width="15"/>
      <path d="M52 51 H140" stroke="#FFF4D6" stroke-width="9"/>
      <path d="M58 49 H80" stroke="#FFFFFF" stroke-width="3"/>
    </g>
  </g>
</svg>
