<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- route-corner-right-up: route tile, corner, enters left, leaves top. Single frame. Anchor centre (96,96). Quarter-circle centre line r 96 with the same layered strokes as the straight tile. -->
  <g id="route-corner">
    <g id="track" fill="none" stroke-linecap="butt">
      <path id="glow" d="M0 96 A96 96 0 0 0 96 0" stroke="#3FB8AF" stroke-width="164" opacity="0.3"/>
      <path id="outline" d="M0 96 A96 96 0 0 0 96 0" stroke="#2A1E3D" stroke-width="146"/>
      <path id="border" d="M0 96 A96 96 0 0 0 96 0" stroke="#3FB8AF" stroke-width="134"/>
      <path id="border-light" d="M0 96 A96 96 0 0 0 96 0" stroke="#7FD9D2" stroke-width="124"/>
      <path id="inner-line" d="M0 96 A96 96 0 0 0 96 0" stroke="#2A1E3D" stroke-width="112"/>
      <path id="dust" d="M0 96 A96 96 0 0 0 96 0" stroke="#E6DDF7" stroke-width="106"/>
    </g>
    <g id="specks" fill="#C9C0F0">
      <ellipse cx="22.6" cy="62" rx="6.5" ry="4.8"/>
      <ellipse cx="118.7" cy="47.9" rx="6.5" ry="4.8"/>
    </g>
    <g id="arrow" transform="translate(67.9 67.9) rotate(-45)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-15 -24 L13 0 L-15 24" stroke="#B3A8E3" stroke-width="17"/>
      <path d="M-15 -24 L13 0 L-15 24" stroke="#FFFFFF" stroke-width="5" opacity="0.8" transform="translate(-3 -2)"/>
    </g>
  </g>
</svg>
