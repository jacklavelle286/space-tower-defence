<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- route-portal-end-up: route start cap for a route that starts on the bottom edge heading up: the track leaves the portal as a glowing fan on the bottom edge and matches the straight tile on the opposite edge. Drawn for LD11; the fan is route-portal-end's, turned (it has no light side), the sparkles, specks and arrow are drawn for this tile. Single frame. Anchor centre (96,96). -->
  <g id="route-portal-end">
    <g id="track" transform="rotate(270 96 96)">
      <path id="glow" d="M0 -2 C55 -2 50 14 105 14 H192 V178 H105 C50 178 55 194 0 194 Z" fill="#3FB8AF" opacity="0.3"/>
      <path id="outline" d="M0 7 C55 7 50 23 105 23 H192 V169 H105 C50 169 55 185 0 185 Z" fill="#2A1E3D"/>
      <path id="border" d="M0 13 C55 13 50 29 105 29 H192 V163 H105 C50 163 55 179 0 179 Z" fill="#3FB8AF"/>
      <path id="border-light" d="M0 18 C55 18 50 34 105 34 H192 V158 H105 C50 158 55 174 0 174 Z" fill="#7FD9D2"/>
      <path id="inner-line" d="M0 24 C55 24 50 40 105 40 H192 V152 H105 C50 152 55 168 0 168 Z" fill="#2A1E3D"/>
      <path id="dust" d="M0 27 C55 27 50 43 105 43 H192 V149 H105 C50 149 55 165 0 165 Z" fill="#E6DDF7"/>
    </g>
    <g id="mouth-glow">
      <ellipse cx="96" cy="192" rx="62" ry="34" fill="#FFF4D6" opacity="0.55"/>
      <ellipse cx="96" cy="192" rx="40" ry="16" fill="#FFFFFF" opacity="0.7"/>
    </g>
    <g id="specks" fill="#C9C0F0"><ellipse cx="126" cy="32" rx="6.5" ry="4.8"/></g>
    <g id="sparkles">
      <path d="M56 144 Q58.8 151.2 66 154 Q58.8 156.8 56 164 Q53.2 156.8 46 154 Q53.2 151.2 56 144 Z" fill="#FFF4D6"/>
      <path d="M140 137 Q142 142 147 144 Q142 146 140 151 Q138 146 133 144 Q138 142 140 137 Z" fill="#9FF3FF"/>
    </g>
    <g id="arrow" transform="translate(96 68)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-15 -24 L13 0 L-15 24" stroke="#B3A8E3" stroke-width="17" transform="rotate(270)"/>
      <path d="M-15 -24 L13 0 L-15 24" stroke="#FFFFFF" stroke-width="5" opacity="0.8" transform="translate(-3 -2) rotate(270)"/>
    </g>
  </g>
</svg>
