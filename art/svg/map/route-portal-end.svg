      <path d="M48 133 Q50 138 55 140 Q50 142 48 147 Q46 142 41 140 Q46 138 48 133 Z" fill="#9FF3FF"/>
    </g>
    <g id="arrow" transform="translate(124 96) rotate(0)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-15 -24 L13 0 L-15 24" stroke="#B3A8E3" stroke-width="17"/>
      <path d="M-15 -24 L13 0 L-15 24" stroke="#FFFFFF" stroke-width="5" opacity="0.8" transform="translate(-3 -2)"/>
    </g>
  </g>
</svg>
