    <clipPath id="rock-clip"><path d="M100 250 Q98 196 152 186 Q206 180 236 222 Q254 262 230 300 Q206 336 160 334 Q110 330 102 290 Z"/></clipPath>
    <path id="rock" d="M100 250 Q98 196 152 186 Q206 180 236 222 Q254 262 230 300 Q206 336 160 334 Q110 330 102 290 Z" fill="#D08A55" stroke="none"/>
