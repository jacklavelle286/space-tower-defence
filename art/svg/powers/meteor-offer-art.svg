      <path d="M0 -13 Q3.6 -3.6 13 0 Q3.6 3.6 0 13 Q-3.6 3.6 -13 0 Q-3.6 -3.6 0 -13 Z" transform="translate(220 18) rotate(0)" fill="#FFFFFF" stroke="none"/>
      <path d="M0 -12 Q3.4 -3.4 12 0 Q3.4 3.4 0 12 Q-3.4 3.4 -12 0 Q-3.4 -3.4 0 -12 Z" transform="translate(96 36) rotate(0)" fill="#FFF4D6" stroke="none"/>
    </g>
  </g>
  <g id="meteor">
