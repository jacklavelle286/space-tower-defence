    <path d="M0 -16 L4.2 -5.8 L15.2 -4.9 L6.8 2.2 L9.4 12.9 L0 7.2 L-9.4 12.9 L-6.8 2.2 L-15.2 -4.9 L-4.2 -5.8 Z" transform="translate(452 236) rotate(12)" fill="#FFD86B" stroke="#2A1E3D" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0 -15 L4 -5.5 L14.3 -4.6 L6.4 2.1 L8.8 12.1 L0 6.8 L-8.8 12.1 L-6.4 2.1 L-14.3 -4.6 L-4 -5.5 Z" transform="translate(92 432) rotate(8)" fill="#9FF3FF" stroke="#2A1E3D" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0 -18 Q5 -5 18 0 Q5 5 0 18 Q-5 5 -18 0 Q-5 -5 0 -18 Z" transform="translate(270 64) rotate(0)" fill="#FFF4D6" stroke="none"/>
    <path d="M0 -14 Q3.9 -3.9 14 0 Q3.9 3.9 0 14 Q-3.9 3.9 -14 0 Q-3.9 -3.9 0 -14 Z" transform="translate(250 470) rotate(0)" fill="#FFFFFF" stroke="none"/>
    <path d="M0 -12 Q3.4 -3.4 12 0 Q3.4 3.4 0 12 Q-3.4 3.4 -12 0 Q-3.4 -3.4 0 -12 Z" transform="translate(40 250) rotate(0)" fill="#FFF4D6" stroke="none"/>
  </g>
  <g id="moon">
    <clipPath id="moon-clip"><circle cx="398" cy="392" r="76"/></clipPath>
    <circle cx="398" cy="392" r="76" fill="#9C8FD6" stroke="none"/>
    <path clip-path="url(#moon-clip)" d="M450 330 Q500 420 400 476 L480 480 L490 320 Z" fill="#6B5CA5" stroke="none"/>
