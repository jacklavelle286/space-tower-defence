    <circle cx="166" cy="198" r="5" fill="#FFF4D6" stroke="none"/>
    <path id="rock-outline" d="M100 250 Q98 196 152 186 Q206 180 236 222 Q254 262 230 300 Q206 336 160 334 Q110 330 102 290 Z" fill="none"/>
  </g>
