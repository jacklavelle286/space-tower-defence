<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- meteor-offer-art: cheerful glowing meteor (no face) with a gold and cyan sparkly tail streaking past a small purple moon, stars around. Single frame. Anchor centre (256,256).
       Light from the top-left. See art/STYLE.md. -->

<g id="meteor-offer" stroke="#2A1E3D" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
