    <path d="M336 396 Q336 348 376 330" fill="none" stroke="#B3A8E3" stroke-width="8"/>
    <circle cx="398" cy="392" r="76" fill="none"/>
  </g>
  <g id="tail" transform="translate(170 262) rotate(-36)">
    <path d="M0 -66 C90 -70 200 -50 300 -14 Q318 0 300 14 C200 50 90 70 0 66 Z" fill="#FFE79A"/>
    <path d="M8 -40 C90 -44 180 -30 262 -8 Q272 0 262 8 C180 30 90 44 8 40 Z" fill="#FFC94A" stroke="none"/>
    <path d="M14 -14 C90 -16 160 -10 220 -3 Q226 0 220 3 C160 10 90 16 14 14 Z" fill="#9FF3FF" stroke="none"/>
