<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- icon-healer: healer trait: a cream sticking plaster at a slant, darker centre pad, no cross. Single frame. Anchor centre (32,32).
       Light from the top-left. See art/STYLE.md. -->

<g id="plaster" transform="rotate(-38 32 32)" stroke="#2A1E3D" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
  <clipPath id="strip-clip"><rect x="4" y="21" width="56" height="22" rx="11"/></clipPath>
  <rect id="strip" x="4" y="21" width="56" height="22" rx="11" fill="#FFF4D6" stroke="none"/>
  <rect id="strip-shade" clip-path="url(#strip-clip)" x="0" y="36" width="64" height="10" fill="#E9D9B4" stroke="none"/>
  <rect id="pad" x="23" y="23.5" width="18" height="17" rx="4" fill="#E2B98A" stroke-width="2.5"/>
  <g id="holes" fill="#C8A57A" stroke="none">
    <circle cx="11.5" cy="29" r="1.3"/><circle cx="16.5" cy="35" r="1.3"/>
    <circle cx="47.5" cy="29" r="1.3"/><circle cx="52.5" cy="35" r="1.3"/>
  </g>
  <path id="strip-highlight" d="M10 27 Q11 25 14 24.5" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <rect id="strip-outline" x="4" y="21" width="56" height="22" rx="11" fill="none"/>
</g>
</svg>
