<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- icon-sync-device: Sync this device: a cream laptop with a pale screen. Single frame. Anchor centre (32,32).
       Light from the top-left. See art/STYLE.md. -->

<g id="sync-device" stroke="#2A1E3D" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
  <g id="laptop">
  <clipPath id="screen-clip"><path d="M14 13 Q10 13 10 17 V42 H54 V17 Q54 13 50 13 Z"/></clipPath>
  <g id="screen-fill" clip-path="url(#screen-clip)" stroke="none">
    <path d="M14 13 Q10 13 10 17 V42 H54 V17 Q54 13 50 13 Z" fill="#E6D9B5"/>
    <path d="M14 13 Q10 13 10 17 V42 H54 V17 Q54 13 50 13 Z" fill="#FFF4D6" transform="translate(-3 -3)"/>
