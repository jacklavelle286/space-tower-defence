  <rect id="screen-inner" x="16" y="19" width="32" height="18" rx="2.5" fill="#CFE9FF" stroke-width="2.5"/>
  <path d="M20 24 L24 21" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
  <clipPath id="base-clip"><path d="M4 46 Q4 43 8 43 H56 Q60 43 60 46 Q60 52 54 52 H10 Q4 52 4 46 Z"/></clipPath>
