  </g>
  <path id="base-outline" d="M4 46 Q4 43 8 43 H56 Q60 43 60 46 Q60 52 54 52 H10 Q4 52 4 46 Z" fill="none"/>
  <path id="trackpad" d="M27 47.5 H37" fill="none" stroke-width="2.5"/>
  </g>
</g>
</svg>
