<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- icon-target-fast: Aim mode FAST: a small magenta alien running to the right with speed lines behind it. Single frame. Anchor centre (32,32).
       Light from the top-left. See art/STYLE.md. -->

<g id="target-fast" stroke="#2A1E3D" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
  <g id="speed-lines" fill="none" stroke-width="3.5">
    <path d="M5 21 H15"/><path d="M3 31 H17"/><path d="M6 41 H16"/>
  </g>
  <g id="legs" stroke-width="3">
    <path d="M33 45 L27 52" stroke="#2A1E3D" stroke-width="8"/><path d="M33 45 L27 52" stroke="#E05FD0" stroke-width="3"/>
    <ellipse cx="25.5" cy="53.5" rx="5" ry="3.5" fill="#E05FD0" transform="rotate(-20 25.5 53.5)"/>
    <path d="M45 45 L50 52" stroke="#2A1E3D" stroke-width="8"/><path d="M45 45 L50 52" stroke="#E05FD0" stroke-width="3"/>
    <ellipse cx="52.5" cy="53" rx="5" ry="3.5" fill="#E05FD0" transform="rotate(10 52.5 53)"/>
  </g>
