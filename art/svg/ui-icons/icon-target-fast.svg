  </g>
  <path id="body-highlight" d="M28 33 Q28 23 36 20" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85"/>
  <path id="body-outline" d="M24 38 Q22 18 38 15 Q54 13 55 30 Q56 45 42 47 Q26 49 24 38 Z" fill="none"/>
  <g id="eyes" stroke="none">
    <ellipse cx="42" cy="28" rx="2.6" ry="3.3" fill="#2A1E3D"/><ellipse cx="50" cy="27.5" rx="2.4" ry="3.1" fill="#2A1E3D"/>
    <circle cx="43" cy="26.7" r="1.1" fill="#FFFFFF"/><circle cx="50.9" cy="26.2" r="1" fill="#FFFFFF"/>
