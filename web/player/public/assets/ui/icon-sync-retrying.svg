<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- icon-sync-retrying: Sync retrying: two cream circular arrows chasing each other, with a small cream clock. Single frame. Anchor centre (32,32).
